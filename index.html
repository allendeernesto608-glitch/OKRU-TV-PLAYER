<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Plaza de la Dignidad TV</title>
<link href="https://googleapis.com" rel="stylesheet">
<script src="https://jsdelivr.net"></script>
<style>
:root{--glass:rgba(24,20,18,.74);--border:rgba(255,248,235,.15);--terra:#c2410c;--cream:#fde68a;--txt:#fafaf9;--muted:#d6d3d1}
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
body,html{width:100vw;height:100vh;overflow:hidden;background:#0c0a09;font-family:'Plus Jakarta Sans',sans-serif;color:var(--txt)}
#backdrop{position:fixed;inset:0;z-index:0;background:radial-gradient(circle at 75% 40%,#291811 0%,#14100e 55%,#090807 100%)}
#player{position:fixed;inset:0;width:100%;height:100%;z-index:1}
video{width:100%;height:100%;object-fit:contain}
#clock{position:fixed;top:26px;right:32px;z-index:18;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--border);padding:8px 16px;border-radius:10px;display:flex;align-items:center;gap:10px;font-size:.9rem;font-weight:600;color:var(--muted);transition:opacity .3s}
#clock.hidden{opacity:0}
.dot{width:8px;height:8px;border-radius:50%;background:#ef4444;box-shadow:0 0 8px #ef4444}
#menu{position:fixed;top:0;left:0;width:410px;max-width:88vw;height:100vh;z-index:20;background:var(--glass);backdrop-filter:blur(20px) saturate(130%);border-right:1px solid var(--border);box-shadow:16px 0 48px rgba(0,0,0,.65);display:flex;flex-direction:column;padding:36px 26px 26px 30px;transition:transform .35s cubic-bezier(.22,1,.36,1),opacity .25s}
#menu.hidden{transform:translateX(-105%);opacity:0;pointer-events:none}
.header{margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.title{font-family:'Montserrat',sans-serif;font-weight:900;font-size:1.65rem;line-height:1.08;text-transform:uppercase}
.title span{color:#fb923c}
.slogan{font-family:'Playfair Display',serif;font-style:italic;font-size:1.35rem;color:var(--cream);margin-top:8px}
#list{flex:1;overflow-y:auto;padding-right:6px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.item{display:flex;align-items:center;gap:15px;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid transparent;cursor:pointer;transition:.2s}
.item.focused,.item:hover{background:linear-gradient(90deg,rgba(194,65,12,.68),rgba(234,88,12,.25));border-color:rgba(251,146,60,.65);transform:translateX(6px)}
.item.active{border-left:4px solid var(--cream)}
.num{font-family:'Montserrat',sans-serif;font-weight:800;color:var(--cream);min-width:26px}
.name{font-weight:600;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat{font-size:.78rem;color:var(--muted);margin-top:2px}
.footer{margin-top:16px;padding-top:12px;border-top:1px solid var(--border);display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted)}
.key{background:rgba(255,255,255,.1);padding:2px 6px;border-radius:4px;color:var(--cream);font-weight:700;margin-right:3px}
#osd{position:fixed;bottom:34px;right:34px;z-index:15;background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--border);padding:14px 22px;border-radius:14px;display:flex;align-items:center;gap:14px;opacity:0;transform:translateY(15px);transition:.3s;pointer-events:none}
#osd.visible{opacity:1;transform:translateY(0)}
.ind{width:10px;height:10px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e}
.ind.load{background:#f59e0b;box-shadow:0 0 10px #f59e0b}
.ind.err{background:#ef4444;box-shadow:0 0 10px #ef4444}
</style>
</head>
<body>
<div id="backdrop"></div>
<div id="player"><video id="vid" playsinline autoplay></video></div>
<div id="clock"><span class="dot"></span><span>EN VIVO</span><span style="opacity:.4">|</span><span id="time">--:--</span></div>
<div id="osd"><div id="ind" class="ind"></div><div><div id="osd-t" style="font-weight:700">Sintonizando...</div><div id="osd-s" style="font-size:.8rem;color:var(--muted)">Plaza de la Dignidad TV</div></div></div>
<aside id="menu">
<header class="header"><h1 class="title">PLAZA DE LA DIGNIDAD <span>TV</span></h1><p class="slogan">“La historia es nuestra”</p></header>
<div id="list" role="listbox"></div>
<footer class="footer"><span><span class="key">OK</span>Menú/Ver</span><span><span class="key">▲▼</span>Mover</span><span><span class="key">CH+/-</span>Zapping</span></footer>
</aside>
<script>
const CHANNELS=[
{n:"01",name:"Señal Principal • Documental",cat:"Memoria y Territorio • HD",url:"https://mux.dev"},
{n:"02",name:"Informativo & Actualidad",cat:"Prensa Independiente • 24/7",url:"https://akamaized.net"},
{n:"03",name:"Cine y Archivo Histórico",cat:"Cultura Latinoamericana",url:"https://unified-streaming.com"},
{n:"04",name:"Música y Canto Popular",cat:"Arte Comunitario",url:"https://apple.com"}
];
const vid=document.getElementById('vid'),menu=document.getElementById('menu'),clk=document.getElementById('clock'),timeEl=document.getElementById('time'),listEl=document.getElementById('list'),osd=document.getElementById('osd'),osdT=document.getElementById('osd-t'),osdS=document.getElementById('osd-s'),ind=document.getElementById('ind');
let hls=null,cur=0,foc=0,open=true,timer=null,tries=0;
const CFG={enableWorker:true,lowLatencyMode:false,maxBufferLength:30,maxMaxBufferLength:60,maxBufferSize:60000000,startLevel:-1,capLevelToPlayerSize:true,manifestLoadingTimeOut:10000,fragLoadingMaxRetry:4,levelLoadingMaxRetry:4};
setInterval(()=>{timeEl.textContent=new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'})},1000);
function render(){
listEl.innerHTML='';
CHANNELS.forEach((c,i)=>{
const d=document.createElement('div');
d.className='item'+(i===foc?' focused':'')+(i===cur?' active':'');
d.innerHTML=`<span class="num">${c.n}</span><div style="overflow:hidden"><div class="name">${c.name}</div><div class="cat">${c.cat}</div></div>`;
d.onclick=()=>{foc=i;play(i,true)};
listEl.appendChild(d);
});
}
function updateUI(){
document.querySelectorAll('.item').forEach((el,i)=>{
el.classList.toggle('focused',i===foc);
el.classList.toggle('active',i===cur);
if(i===foc)el.scrollIntoView({behavior:'smooth',block:'nearest'});
});
}
function toggle(state){
open=typeof state==='boolean'?state:!open;
if(open){foc=cur;updateUI();menu.classList.remove('hidden');clk.classList.remove('hidden')}
else{menu.classList.add('hidden');clk.classList.add('hidden')}
}
function showOSD(c,txt,st='live'){
osdT.textContent=`${c.n} • ${c.name}`;osdS.textContent=txt;
ind.className='ind'+(st==='load'?' load':st==='err'?' err':'');
osd.classList.add('visible');clearTimeout(timer);
timer=setTimeout(()=>osd.classList.remove('visible'),3500);
}
function play(i,close=true){
if(i<0)i=CHANNELS.length-1;if(i>=CHANNELS.length)i=0;
cur=i;foc=i;tries=0;const c=CHANNELS[i];
updateUI();showOSD(c,'Sintonizando señal...','load');
if(close)toggle(false);
if(hls){hls.stopLoad();hls.detachMedia();hls.destroy();hls=null}
if(Hls.isSupported()){
hls=new Hls(CFG);hls.loadSource(c.url);hls.attachMedia(vid);
hls.on(Hls.Events.MANIFEST_PARSED,()=>{
vid.play().catch(()=>{vid.muted=true;vid.play();showOSD(c,'En vivo (Presiona M para sonido)')});
showOSD(c,'Señal estable • En vivo');
});
hls.on(Hls.Events.ERROR,(e,d)=>{
if(d.fatal){
if(d.type===Hls.ErrorTypes.NETWORK_ERROR&&tries<3){tries++;showOSD(c,`Reconectando (${tries}/3)...`,'load');hls.startLoad()}
else if(d.type===Hls.ErrorTypes.MEDIA_ERROR){showOSD(c,'Optimizando video...','load');hls.recoverMediaError()}
else{showOSD(c,'Señal sin respuesta','err');hls.destroy()}
}
});
}else if(vid.canPlayType('application/vnd.apple.mpegurl')){
vid.src=c.url;vid.addEventListener('loadedmetadata',()=>{vid.play();showOSD(c,'Señal estable • En vivo')},{once:true});
}
}
document.addEventListener('keydown',e=>{
const k=e.key,kc=e.keyCode;
if(k==='Enter'||kc===13){e.preventDefault();open?play(foc,true):toggle(true)}
else if(k==='ChannelUp'||k==='PageUp'||kc===427||kc===33){e.preventDefault();play(cur+1,true)}
else if(k==='ChannelDown'||k==='PageDown'||kc===428||kc===34){e.preventDefault();play(cur-1,true)}
else if(k==='ArrowUp'||kc===38){e.preventDefault();if(open){foc=(foc-1+CHANNELS.length)%CHANNELS.length;updateUI()}else play(cur-1,true)}
else if(k==='ArrowDown'||kc===40){e.preventDefault();if(open){foc=(foc+1)%CHANNELS.length;updateUI()}else play(cur+1,true)}
else if(k==='ArrowLeft'||kc===37){if(!open)toggle(true)}
else if(k==='ArrowRight'||k==='Escape'||k==='Backspace'||kc===39||kc===27||kc===461){if(open){e.preventDefault();toggle(false)}}
else if(k.toLowerCase()==='m'){vid.muted=!vid.muted;showOSD(CHANNELS[cur],vid.muted?'Audio silenciado':'Audio activado')}
});
render();play(0,false);
</script>
</body>
</html>
