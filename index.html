<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OKRU TV</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
    #player { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; z-index: 1; }
    video { width: 100%; height: 100%; object-fit: contain; }
    #menu { position: fixed; top: 0; left: 0; width: 360px; height: 100%; background: #111; z-index: 10; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; border-right: 2px solid #333; transition: transform 0.3s ease; }
    #menu.oculto { transform: translateX(-100%); }
    .btn { background: #00f2fe; color: #000; border: none; padding: 12px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-bottom: 12px; font-size: 1rem; text-align: center; }
    #lista { flex: 1; overflow-y: auto; background: #000; border: 1px solid #333; border-radius: 6px; padding: 5px; }
    .item { padding: 10px; border-bottom: 1px solid #222; cursor: pointer; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item:hover, .item.activo { background: #00f2fe; color: #000; font-weight: bold; }
    #barra { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; background: rgba(17,17,17,0.9); padding: 8px 16px; border-radius: 30px; display: flex; gap: 15px; align-items: center; border: 1px solid #444; transition: opacity 0.3s; }
    #barra.oculto { opacity: 0; pointer-events: none; }
    .nav { background: #333; color: #fff; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <div id="player">
    <video id="video" autoplay controls playsinline></video>
  </div>

  <div id="menu">
    <h2 style="color: #00f2fe; margin-bottom: 15px;">OKRU TV - TV1</h2>
    <button class="btn" onclick="document.getElementById('file').click()">📁 Cargar Archivo M3U</button>
    <input type="file" id="file" accept=".m3u,.m3u8,.txt" style="display:none">
    <div id="lista"></div>
  </div>

  <div id="barra">
    <button class="nav" onclick="cambiar(-1)">⏮ Ant</button>
    <span id="actual" style="font-size: 0.85rem; color: #00f2fe;">Selecciona un canal</span>
    <button class="nav" onclick="cambiar(1)">Sig ⏭</button>
  </div>

  <script>
    let canales = [];
    let indiceActual = -1;
    let clicks = 0;
    let timer = null;

    // Control de menú con 1 clic (mostrar) o doble clic (ocultar) sobre el video
    document.getElementById('player').addEventListener('click', () => {
      clicks++;
      if (clicks === 1) {
        timer = setTimeout(() => {
          document.getElementById('menu').classList.remove('oculto');
          document.getElementById('barra').classList.remove('oculto');
          clicks = 0;
        }, 250);
      } else {
        clearTimeout(timer);
        document.getElementById('menu').classList.add('oculto');
        document.getElementById('barra').classList.add('oculto');
        clicks = 0;
      }
    });

    document.getElementById('file').addEventListener('change', function(e) {
      let archivo = e.target.files[0];
      if (!archivo) return;
      let lector = new FileReader();
      lector.onload = function(evt) {
        procesarM3U(evt.target.result);
      };
      lector.readAsText(archivo);
    });

    function procesarM3U(texto) {
      let lineas = texto.split('\n');
      canales = [];
      let nombre = "Canal";

      for (let i = 0; i < lineas.length; i++) {
        let l = lineas[i].trim();
        if (l.startsWith('#EXTINF:')) {
          let coma = l.lastIndexOf(',');
          if (coma !== -1) nombre = l.substring(coma + 1).trim();
        } else if (l && !l.startsWith('#')) {
          canales.push({ nombre: nombre, url: l });
          nombre = "Canal";
        }
      }
      renderizarLista();
      if (canales.length > 0) reproducir(0);
    }

    function renderizarLista() {
      let contenedor = document.getElementById('lista');
      contenedor.innerHTML = '';
      canales.forEach((ch, idx) => {
        let div = document.createElement('div');
        div.className = 'item' + (idx === indiceActual ? ' activo' : '');
        div.innerText = (idx + 1) + '. ' + ch.nombre;
        div.onclick = (ev) => {
          ev.stopPropagation();
          reproducir(idx);
        };
        contenedor.appendChild(div);
      });
    }

    function reproducir(idx) {
      if (idx < 0 || idx >= canales.length) return;
      indiceActual = idx;
      let ch = canales[indiceActual];
      let vid = document.getElementById('video');
      vid.src = ch.url;
      vid.play().catch(() => {});
      document.getElementById('actual').innerText = (indiceActual + 1) + '. ' + ch.nombre;
      renderizarLista();
    }

    function cambiar(dir) {
      let nuevo = indiceActual + dir;
      if (nuevo >= canales.length) nuevo = 0;
      if (nuevo < 0) nuevo = canales.length - 1;
      reproducir(nuevo);
    }

    // Soporte para control remoto (Teclas de canal y flechas)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ChannelUp' || e.key === 'PageUp' || e.key === 'ArrowRight') cambiar(1);
      if (e.key === 'ChannelDown' || e.key === 'PageDown' || e.key === 'ArrowLeft') cambiar(-1);
    });
  </script>
</body>
</html>
