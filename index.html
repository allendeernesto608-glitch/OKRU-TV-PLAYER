<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OKRU TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
    }
    #video-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 1;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 380px;
      height: 100vh;
      background: rgba(10, 14, 20, 0.92);
      backdrop-filter: blur(10px);
      z-index: 20;
      display: flex;
      flex-direction: column;
      padding: 20px;
      transition: transform 0.3s ease;
      border-right: 1px solid rgba(255,255,255,0.1);
    }
    .sidebar.hidden {
      transform: translateX(-100%);
    }
    .brand {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 15px;
      color: #00f2fe;
    }
    .btn {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
    }
    .btn:hover, .btn:focus {
      background: #00f2fe;
      color: #000;
    }
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .input-box, .select-box {
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      width: 100%;
    }
    .channels-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .channel-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.03);
    }
    .channel-item:hover, .channel-item:focus, .channel-item.active {
      background: rgba(0, 242, 254, 0.2);
      color: #00f2fe;
      font-weight: bold;
    }
    .bottom-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(10, 14, 20, 0.85);
      padding: 8px 16px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 15px;
      border: 1px solid rgba(255,255,255,0.15);
      transition: opacity 0.3s ease;
    }
    .bottom-bar.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .nav-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }
    .nav-btn:hover { background: #00f2fe; color: #000; }
  </style>
</head>
<body>

  <div id="video-container">
    <video id="video" playsinline autoplay></video>
  </div>

  <div class="sidebar" id="sidebar">
    <div class="brand">OKRU TV</div>
    
    <button class="btn" id="btn-file">📁 Cargar Archivo M3U / M3U8 / Astra</button>
    <input type="file" id="file-input" accept=".m3u,.m3u8,.txt,*" style="display:none">

    <div class="filters">
      <select class="select-box" id="category-select">
        <option value="TV1">📺 TV1</option>
        <option value="FAV">⭐ Favoritos</option>
      </select>
      <input type="text" class="input-box" id="search-input" placeholder="Buscar canal...">
    </div>

    <div class="channels-list" id="channels-list"></div>
  </div>

  <div class="bottom-bar" id="bottom-bar">
    <button class="nav-btn" id="btn-prev">⏮ Anterior</button>
    <span id="now-playing" style="font-size: 0.85rem; color: #00f2fe;">Sin señal</span>
    <button class="nav-btn" id="btn-next">Siguiente ⏭</button>
  </div>

  <script>
    let channels = JSON.parse(localStorage.getItem('okru_channels_v5') || '[]');
    let favorites = JSON.parse(localStorage.getItem('okru_favs_v5') || '[]');
    let currentIndex = -1;
    let filtered = [];
    let hls = null;
    let clickTimer = null;

    const video = document.getElementById('video');
    const sidebar = document.getElementById('sidebar');
    const bottomBar = document.getElementById('bottom-bar');
    const videoContainer = document.getElementById('video-container');
    const listContainer = document.getElementById('channels-list');
    const categorySelect = document.getElementById('category-select');
    const searchInput = document.getElementById('search-input');
    const nowPlaying = document.getElementById('now-playing');
    const fileInput = document.getElementById('file-input');

    // 1 clic muestra / 2 clics oculta menú y barra
    videoContainer.addEventListener('click', () => {
      if (clickTimer === null) {
        clickTimer = setTimeout(() => {
          clickTimer = null;
          sidebar.classList.remove('hidden');
          bottomBar.classList.remove('hidden');
        }, 250);
      } else {
        clearTimeout(clickTimer);
        clickTimer = null;
        sidebar.classList.add('hidden');
        bottomBar.classList.add('hidden');
      }
    });

    function playChannel(index) {
      if (filtered.length === 0) return;
      if (index < 0) index = filtered.length - 1;
      if (index >= filtered.length) index = 0;

      currentIndex = index;
      const ch = filtered[currentIndex];
      if (!ch) return;

      nowPlaying.textContent = `${currentIndex + 1}. ${ch.title}`;
      renderChannels();

      if (hls) {
        hls.destroy();
        hls = null;
      }

      if (Hls.isSupported() && (ch.url.includes('.m3u8') || ch.url.includes('astra') || !ch.url.endsWith('.mp4'))) {
        hls = new Hls();
        hls.loadSource(ch.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
      } else {
        video.src = ch.url;
        video.play().catch(()=>{});
      }
    }

    document.getElementById('btn-prev').addEventListener('click', (e) => {
      e.stopPropagation();
      playChannel(currentIndex - 1);
    });

    document.getElementById('btn-next').addEventListener('click', (e) => {
      e.stopPropagation();
      playChannel(currentIndex + 1);
    });

    function parseM3U(text) {
      const lines = text.split(/\r?\n/);
      const list = [];
      let title = 'Canal';

      for (let line of lines) {
        line = line.trim();
        if (!line) continue;
        if (line.startsWith('#EXTINF:')) {
          const comma = line.lastIndexOf(',');
          title = comma !== -1 ? line.substring(comma + 1).trim() : 'Canal';
        } else if (!line.startsWith('#') && (line.startsWith('http://') || line.startsWith('https://') || line.startsWith('udp://'))) {
          list.push({ title, group: 'TV1', url: line.split(' ')[0] });
          title = 'Canal';
        }
      }
      return list;
    }

    function toggleFav(url, e) {
      e.stopPropagation();
      const pos = favorites.indexOf(url);
      if (pos === -1) favorites.push(url);
      else favorites.splice(pos, 1);
      localStorage.setItem('okru_favs_v5', JSON.stringify(favorites));
      renderChannels();
    }

    function renderChannels() {
      const cat = categorySelect.value;
      const query = searchInput.value.toLowerCase().trim();

      filtered = channels.filter(ch => {
        const matchCat = cat === 'FAV' ? favorites.includes(ch.url) : true;
        const matchQuery = !query || ch.title.toLowerCase().includes(query);
        return matchCat && matchQuery;
      });

      listContainer.innerHTML = '';

      if (filtered.length === 0) {
        listContainer.innerHTML = `<div style="padding:15px; color:#888; font-size:0.85rem;">Carga un archivo M3U para ver los canales en TV1.</div>`;
        return;
      }

      const activeCh = filtered[currentIndex];
      const fragment = document.createDocumentFragment();

      filtered.forEach((ch, idx) => {
        const isFav = favorites.includes(ch.url);
        const isActive = activeCh && activeCh.url === ch.url;

        const div = document.createElement('div');
        div.className = `channel-item ${isActive ? 'active' : ''}`;
        div.innerHTML = `
          <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1;">${idx + 1}. ${ch.title}</span>
          <span style="color:${isFav ? '#ffd700' : '#555'}; padding-left:8px;">★</span>
        `;

        div.addEventListener('click', (e) => {
          e.stopPropagation();
          playChannel(idx);
        });

        div.querySelector('span:last-child').addEventListener('click', (e) => toggleFav(ch.url, e));
        fragment.appendChild(div);
      });

      listContainer.appendChild(fragment);
    }

    document.getElementById('btn-file').addEventListener('click', (e) => {
      e.stopPropagation();
      fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const parsed = parseM3U(ev.target.result);
        if (parsed.length > 0) {
          channels = parsed;
          localStorage.setItem('okru_channels_v5', JSON.stringify(channels));
          renderChannels();
          playChannel(0);
        } else {
          alert('El archivo no contiene canales válidos.');
        }
      };
      reader.readAsText(file);
    });

    categorySelect.addEventListener('change', renderChannels);
    searchInput.addEventListener('input', renderChannels);

    // Mando a distancia TV
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ChannelUp' || e.key === 'PageUp') playChannel(currentIndex + 1);
      if (e.key === 'ChannelDown' || e.key === 'PageDown') playChannel(currentIndex - 1);
      if (e.key === 'Enter' && sidebar.classList.contains('hidden')) {
        sidebar.classList.remove('hidden');
        bottomBar.classList.remove('hidden');
      }
      if (e.key === 'Escape' || e.key === 'Backspace') {
        sidebar.classList.add('hidden');
        bottomBar.classList.add('hidden');
      }
    });

    if (channels.length > 0) renderChannels();
  </script>
</body>
</html>
