<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OKRU TV PLAYER - TV1</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --cyan: #00f2fe;
      --bg-dark: rgba(10, 14, 22, 0.94);
      --border-glass: rgba(255, 255, 255, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body, html {
      width: 100vw;
      height: 100vh;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* REPRODUCTOR */
    #video-box {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* MENÚ LATERAL */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 380px;
      max-width: 85vw;
      height: 100vh;
      background: var(--bg-dark);
      backdrop-filter: blur(12px);
      z-index: 20;
      display: flex;
      flex-direction: column;
      padding: 18px;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      border-right: 1px solid var(--border-glass);
      box-shadow: 10px 0 30px rgba(0,0,0,0.8);
    }

    .sidebar.hidden {
      transform: translateX(-100%);
    }

    .brand {
      font-size: 1.4rem;
      font-weight: 800;
      margin-bottom: 15px;
      color: var(--cyan);
      display: flex;
      justify-content: space-between;
      align-items: center;
      letter-spacing: 1px;
    }

    .btn-load {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid var(--border-glass);
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      margin-bottom: 12px;
      text-align: center;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .btn-load:active, .btn-load:focus {
      background: var(--cyan);
      color: #000;
    }

    .filters-box {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .input-box, .select-box {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border-glass);
      color: #fff;
      padding: 10px;
      border-radius: 10px;
      width: 100%;
      font-size: 0.9rem;
    }

    .channels-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }

    .channel-item {
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      transition: all 0.15s;
    }

    .channel-item:hover, .channel-item:focus, .channel-item.active {
      background: rgba(0, 242, 254, 0.2);
      border-color: var(--cyan);
      color: var(--cyan);
      font-weight: 700;
    }

    /* BARRA INFERIOR DE NAVEGACIÓN */
    .bottom-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: var(--bg-dark);
      backdrop-filter: blur(12px);
      padding: 8px 18px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 15px;
      border: 1px solid var(--border-glass);
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .bottom-bar.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(40px);
      pointer-events: none;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.12);
      border: none;
      color: #fff;
      padding: 9px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
    }

    .nav-btn:active {
      background: var(--cyan);
      color: #000;
    }
  </style>
</head>
<body>

  <!-- REPRODUCTOR -->
  <div id="video-box">
    <video id="video-element" playsinline webkit-playsinline autoplay></video>
  </div>

  <!-- MENÚ LATERAL -->
  <div class="sidebar" id="sidebar-menu">
    <div class="brand">
      <span>OKRU TV</span>
      <span style="font-size: 0.7rem; background: rgba(0,242,254,0.2); padding: 3px 8px; border-radius: 6px; color: var(--cyan);">TV1 MODE</span>
    </div>
    
    <button class="btn-load" id="btn-file-trigger">📁 Cargar Archivo M3U / M3U8</button>
    <input type="file" id="file-input-field" accept=".m3u,.m3u8,.txt,*" style="display:none">

    <div class="filters-box">
      <select class="select-box" id="category-select">
        <option value="TV1">📺 TV1</option>
        <option value="FAV">⭐ Favoritos</option>
      </select>
      <input type="text" class="input-box" id="search-input" placeholder="Buscar canal...">
    </div>

    <div class="channels-list" id="channels-container"></div>
  </div>

  <!-- BARRA INFERIOR -->
  <div class="bottom-bar" id="bottom-bar">
    <button class="nav-btn" id="btn-prev">⏮ Anterior</button>
    <span id="now-playing-label" style="font-size: 0.85rem; color: var(--cyan); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Sin señal</span>
    <button class="nav-btn" id="btn-next">Siguiente ⏭</button>
  </div>

  <script>
    let channelsData = [];
    try { channelsData = JSON.parse(localStorage.getItem('okru_tv1_channels') || '[]'); } catch(e) { channelsData = []; }

    let favoritesList = [];
    try { favoritesList = JSON.parse(localStorage.getItem('okru_tv1_favs') || '[]'); } catch(e) { favoritesList = []; }

    let currentIndex = -1;
    let filteredList = [];
    let hlsInstance = null;
    let clickTracker = null;

    const videoEl = document.getElementById('video-element');
    const sidebarMenu = document.getElementById('sidebar-menu');
    const bottomBar = document.getElementById('bottom-bar');
    const videoBox = document.getElementById('video-box');
    const channelsContainer = document.getElementById('channels-container');
    const categorySelect = document.getElementById('category-select');
    const searchInput = document.getElementById('search-input');
    const nowPlayingLabel = document.getElementById('now-playing-label');
    const fileInputField = document.getElementById('file-input-field');

    // Control de menú: 1 toque/clic muestra / Doble toque/clic oculta
    videoBox.addEventListener('click', () => {
      if (clickTracker === null) {
        clickTracker = setTimeout(() => {
          clickTracker = null;
          sidebarMenu.classList.remove('hidden');
          bottomBar.classList.remove('hidden');
        }, 250);
      } else {
        clearTimeout(clickTracker);
        clickTracker = null;
        sidebarMenu.classList.add('hidden');
        bottomBar.classList.add('hidden');
      }
    });

    function playChannel(index) {
      if (!filteredList || filteredList.length === 0) return;
      if (index < 0) index = filteredList.length - 1;
      if (index >= filteredList.length) index = 0;

      currentIndex = index;
      const ch = filteredList[currentIndex];
      if (!ch) return;

      nowPlayingLabel.textContent = `${currentIndex + 1}. ${ch.title}`;
      renderChannelsDOM();

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      if (window.Hls && Hls.isSupported() && (ch.url.includes('.m3u8') || ch.url.includes('astra') || !ch.url.endsWith('.mp4'))) {
        hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true });
        hlsInstance.loadSource(ch.url);
        hlsInstance.attachMedia(videoEl);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => videoEl.play().catch(()=>{}));
        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hlsInstance.startLoad();
            else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hlsInstance.recoverMediaError();
          }
        });
      } else {
        videoEl.src = ch.url;
        videoEl.play().catch(()=>{});
      }
    }

    document.getElementById('btn-prev').addEventListener('click', (e) => {
      e.stopPropagation();
      playChannel(currentIndex - 1);
    });

    document.getElementById('btn-next').addEventListener('click', (e) => {
      e.stopPropagation();
      playChannel(currentIndex + 1);
    });

    // Parser M3U manteniendo duplicados y unificando en TV1
    function parseM3UFile(text) {
      const lines = text.split(/\r?\n/);
      const list = [];
      let title = 'Canal';

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (!line) continue;
        if (line.startsWith('#EXTINF:')) {
          const comma = line.lastIndexOf(',');
          title = comma !== -1 ? line.substring(comma + 1).trim() : 'Canal';
        } else if (!line.startsWith('#') && (line.startsWith('http://') || line.startsWith('https://') || line.startsWith('udp://'))) {
          list.push({ title: title || 'Canal', group: 'TV1', url: line.split(' ')[0] });
          title = 'Canal';
        }
      }
      return list;
    }

    function toggleFavorite(url, e) {
      e.stopPropagation();
      const pos = favoritesList.indexOf(url);
      if (pos === -1) favoritesList.push(url);
      else favoritesList.splice(pos, 1);
      try { localStorage.setItem('okru_tv1_favs', JSON.stringify(favoritesList)); } catch(e){}
      renderChannelsDOM();
    }

    function renderChannelsDOM() {
      const cat = categorySelect.value;
      const query = searchInput.value.toLowerCase().trim();

      filteredList = channelsData.filter(ch => {
        const matchCat = cat === 'FAV' ? favoritesList.includes(ch.url) : true;
        const matchQuery = !query || ch.title.toLowerCase().includes(query);
        return matchCat && matchQuery;
      });

      channelsContainer.innerHTML = '';

      if (!filteredList || filteredList.length === 0) {
        channelsContainer.innerHTML = `<div style="padding:15px; color:#888; font-size:0.85rem;">Carga tu archivo M3U para ver los canales en TV1.</div>`;
        return;
      }

      const activeCh = filteredList[currentIndex];
      const fragment = document.createDocumentFragment();

      filteredList.forEach((ch, idx) => {
        const isFav = favoritesList.includes(ch.url);
        const isActive = activeCh && activeCh.url === ch.url;

        const div = document.createElement('div');
        div.className = `channel-item ${isActive ? 'active' : ''}`;
        div.innerHTML = `
          <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; font-size:0.9rem;">${idx + 1}. ${ch.title}</span>
          <span style="color:${isFav ? '#ffd700' : '#444'}; padding-left:8px; font-size:1.1rem;">★</span>
        `;

        div.addEventListener('click', (e) => {
          e.stopPropagation();
          playChannel(idx);
        });

        div.querySelector('span:last-child').addEventListener('click', (e) => toggleFavorite(ch.url, e));
        fragment.appendChild(div);
      });

      channelsContainer.appendChild(fragment);
    }

    document.getElementById('btn-file-trigger').addEventListener('click', (e) => {
      e.stopPropagation();
      fileInputField.click();
    });

    fileInputField.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = parseM3UFile(ev.target.result);
          if (parsed && parsed.length > 0) {
            channelsData = parsed;
            localStorage.setItem('okru_tv1_channels', JSON.stringify(channelsData));
            renderChannelsDOM();
            playChannel(0);
          } else {
            alert('El archivo no contiene canales válidos.');
          }
        } catch(err) {
          alert('Error al leer el archivo local.');
        }
      };
      reader.readAsText(file);
    });

    categorySelect.addEventListener('change', renderChannelsDOM);
    searchInput.addEventListener('input', renderChannelsDOM);

    // Controles de mando a distancia / teclado
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ChannelUp' || e.key === 'PageUp') playChannel(currentIndex + 1);
      if (e.key === 'ChannelDown' || e.key === 'PageDown') playChannel(currentIndex - 1);
      if (e.key === 'Enter' && sidebarMenu.classList.contains('hidden')) {
        sidebarMenu.classList.remove('hidden');
        bottomBar.classList.remove('hidden');
      }
      if (e.key === 'Escape' || e.key === 'Backspace') {
        if (document.activeElement !== searchInput) {
          sidebarMenu.classList.add('hidden');
          bottomBar.classList.add('hidden');
        }
      }
    });

    if (channelsData && channelsData.length > 0) {
      renderChannelsDOM();
    }
  </script>
</body>
</html>
