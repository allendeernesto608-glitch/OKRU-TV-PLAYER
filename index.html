<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OKRU TV - Next-Gen Smart Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent-cyan: #00f2fe;
      --accent-pink: #ff007f;
      --star-gold: #ffd700;
      --glass-panel: rgba(6, 9, 15, 0.75);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text-base: #f8fafc;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      outline: none;
      font-family: 'Outfit', sans-serif;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      background: #000;
      color: var(--text-base);
      overflow: hidden;
    }

    /* REPRODUCTOR DE VIDEO FULLSCREEN */
    #video-viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* BADGE DE ESTADO FLOTANTE */
    .status-badge {
      position: fixed;
      top: 22px;
      right: 28px;
      z-index: 35;
      background: rgba(10, 14, 22, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }
    .status-dot.loading { background: var(--star-gold); box-shadow: 0 0 10px var(--star-gold); animation: pulse 0.8s infinite alternate; }
    .status-dot.error { background: var(--accent-pink); box-shadow: 0 0 10px var(--accent-pink); }

    @keyframes pulse {
      from { transform: scale(0.8); opacity: 0.5; }
      to { transform: scale(1.3); opacity: 1; }
    }

    /* MENÚ LATERAL TRANSPARENTE (GLASSMORPHISM) */
    .sidebar-menu {
      position: fixed;
      top: 0;
      left: 0;
      width: 410px;
      max-width: 88vw;
      height: 100vh;
      z-index: 30;
      background: linear-gradient(90deg, rgba(5, 8, 14, 0.92) 0%, rgba(5, 8, 14, 0.68) 75%, rgba(5, 8, 14, 0) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      padding: 24px 20px;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    .sidebar-menu.hidden {
      transform: translateX(-105%);
      opacity: 0;
      pointer-events: none;
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .brand-title {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }

    .brand-title span {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .pro-badge {
      font-size: 0.68rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      color: var(--text-dim);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* BOTONERA DE ACCIÓN */
    .actions-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .ui-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--text-base);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    .ui-btn:hover, .ui-btn:focus {
      background: rgba(0, 242, 254, 0.2);
      border-color: var(--accent-cyan);
      transform: scale(1.02);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.35);
    }

    /* FILTROS Y BÚSQUEDA */
    .filters-box {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .ui-input, .ui-select {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--glass-border);
      color: var(--text-base);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 500;
      width: 100%;
    }

    .ui-select option {
      background: #0c101d;
      color: var(--text-base);
    }

    .ui-input:focus, .ui-select:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
    }

    /* LISTA DE CANALES TRANSPARENTE (RESALTA SOLO NOMBRES) */
    .channels-viewport {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }

    .channels-viewport::-webkit-scrollbar { width: 4px; }
    .channels-viewport::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

    .channel-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 12px;
      border-radius: 10px;
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .channel-info-group {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
      flex: 1;
    }

    .channel-number {
      font-size: 0.8rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.35);
      min-width: 26px;
    }

    .channel-name-txt {
      font-size: 1.05rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.8);
      text-shadow: 0 2px 5px rgba(0,0,0,0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.18s ease;
    }

    /* EFECTO DE RESALTE EXCLUSIVO EN EL NOMBRE */
    .channel-row:hover .channel-name-txt,
    .channel-row:focus .channel-name-txt {
      color: #ffffff;
      font-weight: 700;
      font-size: 1.12rem;
      text-shadow: 0 0 14px rgba(0, 242, 254, 0.9), 0 2px 6px #000;
      transform: translateX(4px);
    }

    .channel-row.active .channel-name-txt {
      color: var(--accent-cyan);
      font-weight: 700;
      font-size: 1.12rem;
      text-shadow: 0 0 14px rgba(0, 242, 254, 0.8), 0 2px 6px #000;
    }

    .channel-row.active .channel-number {
      color: var(--accent-cyan);
      font-weight: 800;
    }

    .fav-star-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.25);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 6px;
      transition: transform 0.2s, color 0.2s;
    }

    .fav-star-btn:hover { transform: scale(1.25); }
    .fav-star-btn.active { color: var(--star-gold); text-shadow: 0 0 12px rgba(255, 215, 0, 0.8); }

    /* PESTAÑAS INFERIORES CENTRALES (RETROCEDER / AVANZAR) */
    .bottom-floating-tabs {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(10, 14, 22, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 8px 16px;
      border-radius: 40px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.85);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }

    .bottom-floating-tabs.hidden {
      transform: translateX(-50%) translateY(120px);
      opacity: 0;
      pointer-events: none;
    }

    .tab-nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 11px 22px;
      border-radius: 30px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    .tab-nav-btn:hover, .tab-nav-btn:focus {
      background: linear-gradient(135deg, var(--accent-cyan), #0088ff);
      color: #000;
      text-shadow: none;
      border-color: #fff;
      transform: scale(1.06);
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
    }

    .active-channel-display {
      max-width: 230px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--accent-cyan);
      padding: 0 8px;
      text-align: center;
    }

    /* MODAL DE CONFIGURACIÓN Y URLs */
    .modal-overlay-bg {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(2, 4, 8, 0.88);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay-bg.hidden { display: none; }

    .modal-dialog-box {
      width: 620px;
      max-width: 95vw;
      background: #0d1322;
      border: 1px solid rgba(0, 242, 254, 0.35);
      border-radius: 18px;
      padding: 26px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-dialog-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-dialog-head h3 {
      font-size: 1.3rem;
      color: var(--accent-cyan);
    }

    .servers-grid-box {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 8px;
      max-height: 190px;
      overflow-y: auto;
    }

    .server-preset-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-base);
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.15s;
    }

    .server-preset-pill:hover, .server-preset-pill:focus {
      background: rgba(0, 242, 254, 0.22);
      border-color: var(--accent-cyan);
    }

    textarea.ui-input {
      min-height: 85px;
      resize: vertical;
      font-family: monospace;
      font-size: 0.82rem;
    }

    .modal-dialog-foot {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</head>
<body>

  <!-- REPRODUCTOR -->
  <div id="video-viewport">
    <video id="tv-video-element" playsinline autoplay></video>
  </div>

  <!-- ESTADO -->
  <div class="status-badge" id="status-badge">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">OKRU TV Conectado</span>
  </div>

  <!-- MENÚ LATERAL TRANSPARENTE -->
  <aside class="sidebar-menu" id="sidebar-menu">
    <div class="brand-header">
      <div class="brand-title">OKRU <span>TV</span></div>
      <div class="pro-badge">PLAYER</div>
    </div>

    <div class="actions-row">
      <button class="ui-btn" id="btn-open-servers">🌐 Servidores / URL</button>
      <button class="ui-btn" id="btn-open-local">📁 Archivo / USB</button>
      <input type="file" id="local-file-selector" accept=".m3u,.m3u8,.txt,*" style="display:none">
    </div>

    <div class="filters-box">
      <select class="ui-select" id="category-dropdown" style="width: 44%;">
        <option value="ALL">📺 Todos</option>
        <option value="FAV">⭐ Favoritos</option>
      </select>
      <input type="text" class="ui-input" id="search-filter-input" placeholder="🔍 Buscar canal..." style="width: 56%;">
    </div>

    <div class="channels-viewport" id="channels-container"></div>
  </aside>

  <!-- PESTAÑAS INFERIORES CENTRALES -->
  <div class="bottom-floating-tabs" id="bottom-tabs">
    <button class="tab-nav-btn" id="btn-prev-chan">⏮ Anterior</button>
    <div class="active-channel-display" id="active-chan-label">Selecciona canal</div>
    <button class="tab-nav-btn" id="btn-next-chan">Siguiente ⏭</button>
  </div>

  <!-- MODAL DE URL Y SERVIDORES -->
  <div class="modal-overlay-bg hidden" id="servers-modal-box">
    <div class="modal-dialog-box">
      <div class="modal-dialog-head">
        <h3>📡 Cargar Lista, Servidor o Astra</h3>
        <button class="ui-btn" id="btn-close-modal" style="padding: 5px 12px;">✕</button>
      </div>

      <label style="font-size:0.83rem; color:var(--text-dim);">Ingresa URL, IP:Puerto o Enlace Remoto (M3U, M3U8, Astra, GitHub, Blogspot):</label>
      <input type="text" class="ui-input" id="url-input-field" placeholder="Ej: http://190.60.39.220:8000/ o https://...">

      <label style="font-size:0.83rem; color:var(--text-dim);">⚡ Servidores y Listas Rápidas:</label>
      <div class="servers-grid-box" id="presets-grid-container"></div>

      <details>
        <summary style="cursor:pointer; font-size:0.82rem; color:var(--accent-cyan); font-weight:600;">📋 Pegar contenido M3U / Astra directo</summary>
        <div style="margin-top:6px; display:flex; flex-direction:column; gap:6px;">
          <textarea class="ui-input" id="raw-text-input" placeholder="#EXTM3U&#10;#EXTINF:-1,Canal&#10;http://servidor:8000/live/..."></textarea>
          <button class="ui-btn" id="btn-process-raw">Cargar Contenido Pegado</button>
        </div>
      </details>

      <div class="modal-dialog-foot">
        <button class="ui-btn" id="btn-submit-url" style="background: linear-gradient(135deg, var(--accent-cyan), #0088ff); color:#000; border:none; font-weight:700;">🚀 Conectar y Reproducir</button>
      </div>
    </div>
  </div>

  <script>
    const PRESET_SERVERS = [
      { name: "IPTV-Org Global", url: "https://iptv-org.github.io/iptv/index.m3u" },
      { name: "IPTV-Org Español", url: "https://iptv-org.github.io/iptv/languages/spa.m3u" },
      { name: "Lista TV Flix HD 2026", url: "https://listatvflixhd2026.blogspot.com" },
      { name: "Cablemax HLS", url: "http://cablemaxsigloxxi.com:8000/playlist.m3u?hls" },
      { name: "Cablemax Root", url: "http://cablemaxsigloxxi.com:8000/" },
      { name: "Servidor 190.60.39.220", url: "http://190.60.39.220:8000/" },
      { name: "Servidor 170.244.209.30", url: "http://170.244.209.30:8000/" },
      { name: "Servidor 38.188.48.83", url: "http://38.188.48.83:8000/" }
    ];

    let channelsList = JSON.parse(localStorage.getItem('okru_channels_data') || '[]');
    let favoritesList = JSON.parse(localStorage.getItem('okru_favs_data') || '[]');
    let customServersList = JSON.parse(localStorage.getItem('okru_servers_data') || '[]');
    let activeChannelIndex = -1;
    let displayedChannels = [];
    let hlsPlayer = null;
    let clickTracker = null;

    const videoElem = document.getElementById('tv-video-element');
    const sidebarMenu = document.getElementById('sidebar-menu');
    const bottomTabs = document.getElementById('bottom-tabs');
    const videoViewport = document.getElementById('video-viewport');
    const channelsContainer = document.getElementById('channels-container');
    const categoryDropdown = document.getElementById('category-dropdown');
    const searchFilterInput = document.getElementById('search-filter-input');
    const activeChanLabel = document.getElementById('active-chan-label');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const serversModalBox = document.getElementById('servers-modal-box');
    const urlInputField = document.getElementById('url-input-field');

    // CONTROL DE MENÚ (1 CLIC / DOBLE CLIC)
    function openMenuAndTabs() {
      sidebarMenu.classList.remove('hidden');
      bottomTabs.classList.remove('hidden');
    }

    function closeMenuAndTabs() {
      sidebarMenu.classList.add('hidden');
      bottomTabs.classList.add('hidden');
    }

    videoViewport.addEventListener('click', (e) => {
      if (clickTracker === null) {
        clickTracker = setTimeout(() => {
          clickTracker = null;
          openMenuAndTabs();
        }, 250);
      } else {
        clearTimeout(clickTracker);
        clickTracker = null;
        closeMenuAndTabs();
      }
    });

    function setStatusState(state, text) {
      statusDot.className = 'status-dot ' + state;
      statusText.textContent = text;
    }

    // MOTOR DE REPRODUCCIÓN ESTABLE
    fnPlayChannelByIndex = function(index) {
      if (displayedChannels.length === 0) return;
      if (index < 0) index = displayedChannels.length - 1;
      if (index >= displayedChannels.length) index = 0;

      activeChannelIndex = index;
      const currentCh = displayedChannels[activeChannelIndex];
      if (!currentCh) return;

      activeChanLabel.textContent = `${activeChannelIndex + 1}. ${currentCh.title}`;
      setStatusState('loading', `Cargando: ${currentCh.title}`);
      renderListToDOM();

      startVideoStream(currentCh.url, currentCh.title, false);
    };

    function startVideoStream(url, title, useProxy) {
      if (hlsPlayer) {
        hlsPlayer.destroy();
        hlsPlayer = null;
      }

      let finalTargetUrl = url.trim();
      if (useProxy) {
        finalTargetUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
      }

      const isHls = finalTargetUrl.includes('.m3u8') || 
                    finalTargetUrl.includes('hls') || 
                    finalTargetUrl.includes('/live/') || 
                    finalTargetUrl.includes('astra') || 
                    (!finalTargetUrl.endsWith('.mp4') && !finalTargetUrl.endsWith('.ts'));

      if (Hls.isSupported() && isHls) {
        hlsPlayer = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 15,
          maxBufferLength: 12,
          manifestLoadingTimeOut: 10000,
          manifestLoadingMaxRetry: 3,
          fragLoadingTimeOut: 12000,
          fragLoadingMaxRetry: 4
        });

        hlsPlayer.loadSource(finalTargetUrl);
        hlsPlayer.attachMedia(videoElem);

        hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
          videoElem.play().catch(() => {});
          setStatusState('', `En vivo: ${title}`);
        });

        hlsPlayer.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
              if (!useProxy && window.location.protocol === 'https:' && url.startsWith('http://')) {
                setStatusState('loading', 'Optimizando túnel seguro...');
                startVideoStream(url, title, true);
              } else {
                setStatusState('loading', 'Reconectando...');
                hlsPlayer.startLoad();
              }
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              hlsPlayer.recoverMediaError();
            } else {
              hlsPlayer.destroy();
              videoElem.src = finalTargetUrl;
              videoElem.play().catch(() => setStatusState('error', 'Señal no disponible'));
            }
          }
        });
      } else {
        videoElem.src = finalTargetUrl;
        videoElem.play()
          .then(() => setStatusState('', `Reproduciendo: ${title}`))
          .catch(() => {
            if (!useProxy) {
              startVideoStream(url, title, true);
            } else {
              setStatusState('error', 'Servidor inaccesible');
            }
          });
      }
    }

    videoElem.addEventListener('playing', () => setStatusState('', `En vivo: ${activeChanLabel.textContent}`));
    videoElem.addEventListener('waiting', () => setStatusState('loading', 'Sincronizando buffer...'));

    // PESTAÑAS INFERIORES
    document.getElementById('btn-prev-chan').addEventListener('click', (e) => {
      e.stopPropagation();
      fnPlayChannelByIndex(activeChannelIndex - 1);
    });

    document.getElementById('btn-next-chan').addEventListener('click', (e) => {
      e.stopPropagation();
      fnPlayChannelByIndex(activeChannelIndex + 1);
    });

    // PARSER UNIVERSAL M3U / M3U8 / ASTRA
    function parseM3UContent(text) {
      const lines = text.split(/\r?\n/);
      const parsed = [];
      let meta = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        if (line.startsWith('#EXTINF:')) {
          const commaIdx = line.lastIndexOf(',');
          const title = commaIdx !== -1 ? line.substring(commaIdx + 1).trim() : 'Canal TV';
          const groupMatch = line.match(/group-title="([^"]*)"/i);
          meta = {
            title: title || 'Canal sin nombre',
            group: groupMatch && groupMatch[1] ? groupMatch[1].trim() : 'General'
          };
        } else if (!line.startsWith('#') && (line.startsWith('http://') || line.startsWith('https://') || line.startsWith('udp://'))) {
          const cleanUrl = line.split(' ')[0].trim();
          parsed.push({
            title: meta ? meta.title : `Canal ${parsed.length + 1}`,
            group: meta ? meta.group : 'Streams',
            url: cleanUrl
          });
          meta = null;
        }
      }

      if (parsed.length === 0 && (text.trim().startsWith('{') || text.trim().startsWith('['))) {
        try {
          const json = JSON.parse(text);
          const items = Array.isArray(json) ? json : (json.streams || json.channels || []);
          items.forEach((it, idx) => {
            if (it.url || it.stream_url) {
              parsed.push({
                title: it.name || it.title || `Astra Stream ${idx + 1}`,
                group: it.category || 'Astra TV',
                url: it.url || it.stream_url
              });
            }
          });
        } catch(e){}
      }

      if (parsed.length === 0) {
        const matches = text.match(/(https?:\/\/[^\s"'<>]+\.(?:m3u8|m3u|ts|mp4)[^\s"'<>]*)/gi);
        if (matches) {
          [...new Set(matches)].forEach((u, idx) => {
            parsed.push({ title: `Stream Web ${idx + 1}`, group: 'Web', url: u });
          });
        }
      }

      return parsed;
    }

    async function fetchWithProxies(targetUrl) {
      const proxies = [
        (u) => u,
        (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
        (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`
      ];

      for (const p of proxies) {
        try {
          const controller = new AbortController();
          const tId = setTimeout(() => controller.abort(), 8000);
          const res = await fetch(p(targetUrl), { signal: controller.signal });
          clearTimeout(tId);
          if (res.ok) {
            const data = await res.text();
            if (data && data.length > 5) return data;
          }
        } catch(e){}
      }
      throw new Error('Fallo al conectar');
    }

    async function loadRemotePlaylist(targetUrl) {
      let url = targetUrl.trim();
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = 'http://' + url;

      setStatusState('loading', 'Conectando servidor...');

      const candidates = [url];
      if (url.endsWith('/') || /:\d+$/.test(url)) {
        const base = url.replace(/\/+$/, '');
        candidates.push(
          `${base}/playlist.m3u8`,
          `${base}/playlist.m3u`,
          `${base}/playlist.m3u?hls`,
          `${base}/channels.m3u`
        );
      }

      let loaded = [];
      for (const cand of candidates) {
        try {
          const raw = await fetchWithProxies(cand);
          const parsed = parseM3UContent(raw);
          if (parsed.length > 0) {
            loaded = parsed;
            break;
          }
        } catch(e){}
      }

      if (loaded.length === 0) {
        loaded = [{ title: `Directo: ${url.replace(/^https?:\/\//, '').substring(0, 22)}`, group: 'Directos', url: url }];
      }

      channelsList = loaded;
      localStorage.setItem('okru_channels_data', JSON.stringify(channelsList));
      saveCustomServerRecord(url);
      buildCategoryList();
      renderListToDOM();
      serversModalBox.classList.add('hidden');
      setStatusState('', `${channelsList.length} canales cargados`);

      if (channelsList.length > 0) fnPlayChannelByIndex(0);
    }

    // RENDERIZADO DE LA LISTA
    function toggleFavoriteChannel(url, event) {
      if (event) event.stopPropagation();
      const p = favoritesList.indexOf(url);
      if (p === -1) favoritesList.push(url);
      else favoritesList.splice(p, 1);
      localStorage.setItem('okru_favs_data', JSON.stringify(favoritesList));
      buildCategoryList();
      renderListToDOM();
    }

    function buildCategoryList() {
      const activeCat = categoryDropdown.value;
      const groups = [...new Set(channelsList.map(c => c.group).filter(Boolean))];
      categoryDropdown.innerHTML = `
        <option value="ALL">📺 Todos (${channelsList.length})</option>
        <option value="FAV">⭐ Favoritos (${favoritesList.length})</option>
      `;
      groups.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g;
        opt.textContent = g;
        categoryDropdown.appendChild(opt);
      });
      if ([...categoryDropdown.options].some(o => o.value === activeCat)) {
        categoryDropdown.value = activeCat;
      }
    }

    function renderListToDOM() {
      const cat = categoryDropdown.value;
      const q = searchFilterInput.value.toLowerCase().trim();

      displayedChannels = channelsList.filter(ch => {
        const matchCat = cat === 'ALL' ? true :
                         cat === 'FAV' ? favoritesList.includes(ch.url) :
                         ch.group === cat;
        const matchQ = !q || ch.title.toLowerCase().includes(q);
        return matchCat && matchQ;
      });

      channelsContainer.innerHTML = '';

      if (displayedChannels.length === 0) {
        channelsContainer.innerHTML = `<div style="padding:16px; color:var(--text-dim); font-size:0.85rem;">Lista vacía. Carga una lista o servidor.</div>`;
        return;
      }

      const activeCh = displayedChannels[activeChannelIndex];

      displayedChannels.forEach((ch, idx) => {
        const isFav = favoritesList.includes(ch.url);
        const isActive = activeCh && activeCh.url === ch.url;

        const row = document.createElement('div');
        row.className = `channel-row ${isActive ? 'active' : ''}`;
        row.tabIndex = 0;

        row.innerHTML = `
          <div class="channel-info-group">
            <span class="channel-number">${idx + 1}</span>
            <span class="channel-name-txt">${ch.title}</span>
          </div>
          <button class="fav-star-btn ${isFav ? 'active' : ''}">★</button>
        `;

        row.addEventListener('click', (e) => {
          e.stopPropagation();
          fnPlayChannelByIndex(idx);
        });

        row.querySelector('.fav-star-btn').addEventListener('click', (e) => toggleFavoriteChannel(ch.url, e));
        channelsContainer.appendChild(row);
      });
    }

    function saveCustomServerRecord(url) {
      if (!PRESET_SERVERS.some(s => s.url === url) && !customServersList.some(s => s.url === url)) {
        customServersList.unshift({ name: url.replace(/^https?:\/\//, '').substring(0, 22), url });
        customServersList = customServersList.slice(0, 6);
        localStorage.setItem('okru_servers_data', JSON.stringify(customServersList));
      }
      renderPresetsUI();
    }

    function renderPresetsUI() {
      const grid = document.getElementById('presets-grid-container');
      grid.innerHTML = '';
      [...customServersList, ...PRESET_SERVERS].forEach(item => {
        const pill = document.createElement('button');
        pill.className = 'server-preset-pill';
        pill.textContent = item.name;
        pill.title = item.url;
        pill.addEventListener('click', () => {
          urlInputField.value = item.url;
          loadRemotePlaylist(item.url);
        });
        grid.appendChild(pill);
      });
    }

    // MODAL Y ARCHIVOS
    document.getElementById('btn-open-servers').addEventListener('click', (e) => {
      e.stopPropagation();
      renderPresetsUI();
      serversModalBox.classList.remove('hidden');
      urlInputField.focus();
    });

    document.getElementById('btn-close-modal').addEventListener('click', () => {
      serversModalBox.classList.add('hidden');
    });

    document.getElementById('btn-submit-url').addEventListener('click', () => {
      loadRemotePlaylist(urlInputField.value);
    });

    document.getElementById('btn-process-raw').addEventListener('click', () => {
      const raw = document.getElementById('raw-text-input').value;
      const parsed = parseM3UContent(raw);
      if (parsed.length > 0) {
        channelsList = parsed;
        localStorage.setItem('okru_channels_data', JSON.stringify(channelsList));
        buildCategoryList();
        renderListToDOM();
        serversModalBox.classList.add('hidden');
        fnPlayChannelByIndex(0);
      } else {
        alert('No se encontraron canales en el texto.');
      }
    });

    document.getElementById('btn-open-local').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('local-file-selector').click();
    });

    document.getElementById('local-file-selector').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const parsed = parseM3UContent(ev.target.result);
        if (parsed.length > 0) {
          channelsList = parsed;
          localStorage.setItem('okru_channels_data', JSON.stringify(channelsList));
          buildCategoryList();
          renderListToDOM();
          setStatusState('', `Archivo cargado: ${file.name}`);
          fnPlayChannelByIndex(0);
        } else {
          setStatusState('error', 'Archivo sin canales válidos');
        }
      };
      reader.readAsText(file);
    });

    categoryDropdown.addEventListener('change', renderListToDOM);
    searchFilterInput.addEventListener('input', renderListToDOM);

    // CONTROL REMOTO DE TV (D-PAD / CH+ / CH-)
    document.addEventListener('keydown', (e) => {
      if (!serversModalBox.classList.contains('hidden')) {
        if (e.key === 'Escape' || e.key === 'Backspace') serversModalBox.classList.add('hidden');
        return;
      }

      switch (e.key) {
        case 'ChannelUp':
        case 'PageUp':
          fnPlayChannelByIndex(activeChannelIndex + 1);
          break;
        case 'ChannelDown':
        case 'PageDown':
          fnPlayChannelByIndex(activeChannelIndex - 1);
          break;
        case 'ArrowRight':
          if (sidebarMenu.classList.contains('hidden')) fnPlayChannelByIndex(activeChannelIndex + 1);
          break;
        case 'ArrowLeft':
          if (sidebarMenu.classList.contains('hidden')) fnPlayChannelByIndex(activeChannelIndex - 1);
          break;
        case 'Enter':
          if (sidebarMenu.classList.contains('hidden')) openMenuAndTabs();
          break;
        case 'Escape':
        case 'Backspace':
          if (document.activeElement !== searchFilterInput) closeMenuAndTabs();
          break;
        case 'f':
        case 'F':
          if (displayedChannels[activeChannelIndex]) toggleFavoriteChannel(displayedChannels[activeChannelIndex].url);
          break;
      }
    });

    // INICIO AUTOMÁTICO
    renderPresetsUI();
    if (channelsList.length > 0) {
      buildCategoryList();
      renderListToDOM();
    } else {
      loadRemotePlaylist("https://iptv-org.github.io/iptv/languages/spa.m3u");
    }
  </script>
</body>
</html>
