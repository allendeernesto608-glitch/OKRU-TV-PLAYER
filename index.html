<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OKRU TV PLAYER</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100vw; height: 100vh; background: #05080f; color: #fff; font-family: sans-serif; overflow: hidden; }
    
    #video-container { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; z-index: 1; }
    video { width: 100%; height: 100%; object-fit: contain; }

    #sidebar {
      position: fixed; top: 0; left: 0; width: 360px; max-width: 90vw; height: 100vh;
      background: #0d1322; z-index: 20; display: flex; flex-direction: column; padding: 16px;
      border-right: 1px solid rgba(255,255,255,0.15); transition: transform 0.3s ease;
    }
    #sidebar.hidden { transform: translateX(-100%); }

    .brand { font-size: 1.4rem; font-weight: bold; margin-bottom: 12px; color: #00f2fe; display: flex; justify-content: space-between; align-items: center; }
    
    .btn-file {
      background: #00f2fe; color: #000; border: none; padding: 12px; border-radius: 8px;
      font-weight: bold; cursor: pointer; text-align: center; margin-bottom: 12px; font-size: 0.95rem;
    }

    #channels-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    
    .channel-row {
      padding: 12px; border-radius: 6px; background: rgba(255,255,255,0.04);
      cursor: pointer; display: flex; justify-content: space-between; font-size: 0.9rem;
    }
    .channel-row.active { background: rgba(0,242,254,0.25); color: #00f2fe; font-weight: bold; }

    #bottom-bar {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 20;
      background: #0d1322; padding: 8px 16px; border-radius: 30px; display: flex; align-items: center;
      gap: 12px; border: 1px solid rgba(255,255,255,0.2); transition: opacity 0.3s;
    }
    #bottom-bar.hidden { opacity: 0; pointer-events: none; }
    
    .nav-btn { background: #222; color: #fff; border: none; padding: 8px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div id="video-container">
    <video id="video" autoplay playsinline></video>
  </div>

  <div id="sidebar">
    <div class="brand">
      <span>OKRU TV</span>
      <span style="font-size: 0.7rem; background: rgba(0,242,254,0.2); padding: 3px 6px; border-radius: 4px; color: #00f2fe;">TV1</span>
    </div>
    
    <button class="btn-file" onclick="document.getElementById('file-input').click()">📁 Cargar Archivo M3U</button>
    <input type="file" id="file-input" accept=".m3u,.m3u8,.txt" style="display:none">

    <div id="channels-list"></div>
  </div>

  <div id="bottom-bar">
    <button class="nav-btn" onclick="cambiarCanal(-1)">⏮ Ant</button>
    <span id="playing-title" style="font-size: 0.85rem; color: #00f2fe; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Sin señal</span>
    <button class="nav-btn" onclick="cambiarCanal(1)">Sig ⏭</button>
  </div>

  <script>
    let listaCanales = [];
    let indiceActivo = -1;
    let toqueContador = 0;
    let toqueTimer = null;

    // Control de visibilidad del menú al tocar la pantalla del video
    document.getElementById('video-container').addEventListener('click', function() {
      toqueContador++;
      if (toqueContador === 1) {
        toqueTimer = setTimeout(function() {
          document.getElementById('sidebar').classList.remove('hidden');
          document.getElementById('bottom-bar').classList.remove('hidden');
          toqueContador = 0;
        }, 250);
      } else {
        clearTimeout(toqueTimer);
        document.getElementById('sidebar').classList.add('hidden');
        document.getElementById('bottom-bar').classList.add('hidden');
        toqueContador = 0;
      }
    });

    // Lector de archivos locales seguro
    document.getElementById('file-input').addEventListener('change', function(e) {
      let archivo = e.target.files[0];
      if (!archivo) return;

      let lector = new FileReader();
      lector.onload = function(evt) {
        let contenido = evt.target.result;
        analizarM3U(contenido);
      };
      lector.readAsText(archivo);
    });

    function analizarM3U(texto) {
      let lineas = texto.split('\n');
      listaCanales = [];
      let nombreTemp = "Canal";

      for (let i = 0; i < lineas.length; i++) {
        let l = lineas[i].trim();
        if (!l) continue;

        if (l.indexOf('#EXTINF:') === 0) {
          let coma = l.lastIndexOf(',');
          if (coma !== -1) {
            nombreTemp = l.substring(coma + 1).trim();
          }
        } else if (l.indexOf('#') !== 0 && (l.indexOf('http://') === 0 || l.indexOf('https://') === 0 || l.indexOf('udp://') === 0)) {
          listaCanales.push({
            title: nombreTemp || "Canal",
            url: l.split(' ')[0]
          });
          nombreTemp = "Canal";
        }
      }

      pintarLista();
      if (listaCanales.length > 0) {
        reproducirCanal(0);
      } else {
        alert("No se encontraron enlaces válidos en el archivo.");
      }
    }

    function pintarLista() {
      let contenedor = document.getElementById('channels-list');
      contenedor.innerHTML = '';

      if (listaCanales.length === 0) {
        contenedor.innerHTML = '<div style="padding:15px; color:#888; font-size:0.85rem;">Carga un archivo M3U para ver los canales en TV1.</div>';
        return;
      }

      listaCanales.forEach(function(ch, idx) {
        let div = document.createElement('div');
        div.className = 'channel-row' + (idx === indiceActivo ? ' active' : '');
        div.innerHTML = '<span>' + (idx + 1) + '. ' + ch.title + '</span>';
        
        div.onclick = function(ev) {
          ev.stopPropagation();
          reproducirCanal(idx);
        };
        contenedor.appendChild(div);
      });
    }

    function reproducirCanal(idx) {
      if (idx < 0 || idx >= listaCanales.length) return;
      indiceActivo = idx;
      let ch = listaCanales[indiceActivo];

      let videoEl = document.getElementById('video');
      videoEl.src = ch.url;
      videoEl.play().catch(function() {});

      document.getElementById('playing-title').innerText = (indiceActivo + 1) + '. ' + ch.title;
      pintarLista();
    }

    function cambiarCanal(direccion) {
      if (listaCanales.length === 0) return;
      let nuevoIdx = indiceActivo + direccion;
      if (nuevoIdx >= listaCanales.length) nuevoIdx = 0;
      if (nuevoIdx < 0) nuevoIdx = listaCanales.length - 1;
      reproducirCanal(nuevoIdx);
    }
  </script>

</body>
</html>
