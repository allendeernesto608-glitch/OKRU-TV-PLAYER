<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OKRU TV - CINEMATIC PLAYER</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <style>
    :root {
      --bg-deep: #030712;
      --glass-panel: rgba(11, 17, 32, 0.88);
      --glass-border: rgba(255, 255, 255, 0.12);
      --neon-cyan: #00f2fe;
      --neon-glow: rgba(0, 242, 254, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body, html {
      width: 100vw; height: 100vh;
      background: var(--bg-deep); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    .app-container {
      position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column;
    }

    /* REPRODUCTOR DE VÍDEO */
    .video-stage {
      position: absolute; inset: 0; width: 100%; height: 100%;
      background: #000; z-index: 1; display: flex; align-items: center; justify-content: center;
    }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }

    /* ENCABEZADO */
    header {
      position: absolute; top: 0; left: 0; right: 0; height: 65px; padding: 0 20px;
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(to bottom, rgba(3,7,18,0.95), rgba(3,7,18,0));
      z-index: 30; pointer-events: none;
    }
    header > * { pointer-events: auto; }
    
    .brand-box { display: flex; align-items: center; gap: 12px; }
    .brand-title {
      font-size: 1.35rem; font-weight: 900; letter-spacing: 1.2px; color: var(--text-main);
      text-shadow: 0 0 15px var(--neon-glow);
    }
    .brand-title span { color: var(--neon-cyan); }
    
    .btn-menu-toggle {
      background: rgba(255,255,255,0.08); color: var(--text-main); border: 1px solid var(--glass-border);
      padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.85rem;
      backdrop-filter: blur(8px); transition: all 0.2s;
    }
    .btn-menu-toggle:hover, .btn-menu-toggle:focus { background: var(--neon-cyan); color: #000; border-color: var(--neon-cyan); outline: none; }

    .header-right { display: flex; align-items: center; gap: 10px; }
    .badge-mode {
      background: rgba(0, 242, 254, 0.12); color: var(--neon-cyan);
      padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 800;
      border: 1px solid rgba(0, 242, 254, 0.3); backdrop-filter: blur(8px);
    }
    #signal-status { font-size: 0.75rem; color: #10b981; font-weight: 800; text-shadow: 0 0 10px rgba(16,185,129,0.4); }

    /* ÁREA DE TRABAJO Y PANEL LATERAL */
    .workspace {
      position: absolute; inset: 0; z-index: 20; pointer-events: none;
      display: flex; padding: 75px 16px 70px 16px; overflow: hidden;
    }

    .drawer {
      width: 380px; max-width: 88vw; height: 100%;
      background: var(--glass-panel); backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border); border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
      display: flex; flex-direction: column; padding: 16px; gap: 12px;
      pointer-events: auto; transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }
    .drawer.collapsed { transform: translateX(-120%); opacity: 0; pointer-events: none; }

    /* CONTROLES DE CARGA LIBRE (USB / LOCAL / URL REMOTA) */
    .load-section {
      display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
      background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; border: 1px solid var(--glass-border);
    }
    .load-row { display: flex; gap: 6px; }
    
    .btn-action {
      background: linear-gradient(135deg, var(--neon-cyan), #0088ff); color: #000;
      border: none; padding: 10px; border-radius: 8px; font-weight: 800; cursor: pointer;
      font-size: 0.85rem; text-align: center; flex: 1; transition: filter 0.2s;
    }
    .btn-action:hover { filter: brightness(1.15); }

    .url-input-box {
      background: rgba(3,7,18,0.7); border: 1px solid var(--glass-border); color: var(--text-main);
      padding: 8px 10px; border-radius: 8px; font-size: 0.82rem; width: 100%; outline: none;
    }
    .url-input-box:focus { border-color: var(--neon-cyan); }

    /* FILTROS Y BUSCADOR */
    .filters-row { display: flex; gap: 6px; flex-shrink: 0; }
    .select-mode, .search-box {
      background: rgba(3,7,18,0.7); border: 1px solid var(--glass-border); color: var(--text-main);
      padding: 8px 10px; border-radius: 8px; font-size: 0.85rem; outline: none;
    }
    .select-mode { width: 110px; font-weight: 700; color: var(--neon-cyan); }
    .search-box { flex: 1; }
    .select-mode:focus, .search-box:focus { border-color: var(--neon-cyan); }

    /* LISTA DE CANALES TV1 */
    .channels-scroll {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px;
      scrollbar-width: thin; scrollbar-color: rgba(0,242,254,0.3) transparent;
    }
    .channel-row {
      padding: 11px 12px; border-radius: 10px; background: rgba(255,255,255,0.03);
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
      font-size: 0.88rem; border: 1px solid transparent; transition: all 0.15s ease;
    }
    .channel-row:hover, .channel-row:focus {
      background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); outline: none;
    }
    .channel-row.active {
      background: rgba(0, 242, 254, 0.18); border-color: var(--neon-cyan);
      color: var(--neon-cyan); font-weight: 800; box-shadow: 0 0 15px rgba(0,242,254,0.15);
    }
    .ch-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .fav-star { padding: 2px 6px; font-size: 1.1rem; color: #475569; cursor: pointer; }
    .fav-star.is-fav { color: #fbbf24; text-shadow: 0 0 10px rgba(251,191,36,0.5); }

    /* BARRA INFERIOR FLOTANTE */
    footer {
      position: absolute; bottom: 0; left: 0; right: 0; height: 60px; padding: 0 20px;
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(to top, rgba(3,7,18,0.95), rgba(3,7,18,0));
      z-index: 30; pointer-events: none;
    }
    footer > * { pointer-events: auto; }

    .nav-btn {
      background: var(--glass-panel); border: 1px solid var(--glass-border); color: var(--text-main);
      padding: 8px 16px; border-radius: 20px; font-weight: 800; cursor: pointer; font-size: 0.82rem;
      backdrop-filter: blur(10px); transition: all 0.2s;
    }
    .nav-btn:hover, .nav-btn:focus { background: var(--neon-cyan); color: #000; border-color: var(--neon-cyan); outline: none; }

    #current-playing {
      font-size: 0.88rem; color: var(--neon-cyan); font-weight: 800;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45vw; text-align: center;
      text-shadow: 0 0 12px var(--neon-glow);
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- REPRODUCTOR -->
    <div class="video-stage" id="video-stage">
      <video id="video-player" playsinline webkit-playsinline autoplay></video>
    </div>

    <!-- ENCABEZADO -->
    <header>
      <div class="brand-box">
        <button class="btn-menu-toggle" id="btn-menu">☰ Menú</button>
        <div class="brand-title">OKRU <span>TV</span></div>
      </div>
      <div class="header-right">
        <span id="signal-status">● LISTO</span>
        <div class="badge-mode">TV1 PRO</div>
      </div>
    </header>

    <!-- PANEL DESPLEGABLE CON CARGA LIBRE -->
    <div class="workspace">
      <aside class="drawer" id="drawer">
        
        <!-- SECCIÓN DE CARGA LIBRE (USB, LOCAL Y URL REMOTA) -->
        <div class="load-section">
          <div class="load-row">
            <button class="btn-action" id="btn-load-local">📁 USB / Archivo Local</button>
            <input type="file" id="file-input" accept=".m3u,.m3u8,.txt,*" style="display:none">
          </div>
          <div class="load-row" style="gap:4px;">
            <input type="text" class="url-input-box" id="url-input" placeholder="Pegar enlace M3U de servidor remoto...">
            <button class="btn-action" id="btn-load-url" style="flex: 0 0 75px;">Cargar</button>
          </div>
        </div>

        <!-- FILTROS Y BÚSQUEDA -->
        <div class="filters-row">
          <select class="select-mode" id="mode-select">
            <option value="TV1">📺 TV1</option>
            <option value="FAV">⭐ Favoritos</option>
          </select>
          <input type="text" class="search-box" id="search-input" placeholder="Buscar canal...">
        </div>

        <!-- LISTA CONTINUA -->
        <div class="channels-scroll" id="channels-container">
          <div style="padding: 25px; text-align: center; color: var(--text-muted); font-size: 0.85rem;">
            Carga un archivo local/USB o ingresa una URL remota para disfrutar de tus canales en TV1.
          </div>
        </div>

      </aside>
    </div>

    <!-- BARRA INFERIOR -->
    <footer>
      <button class="nav-btn" id="btn-prev">⏮ Anterior</button>
      <span id="current-playing">Sin señal seleccionada</span>
      <button class="nav-btn" id="btn-next">Siguiente ⏭</button>
    </footer>

  </div>

  <script>
    let allChannels = [];
    let filteredChannels = [];
    let favorites = [];
    let currentIndex = -1;
    let hls = null;
    let retryTimer = null;

    try {
      allChannels = JSON.parse(localStorage.getItem('okru_cinematic_db') || '[]');
      favorites = JSON.parse(localStorage.getItem('okru_cinematic_fav') || '[]');
    } catch (e) {
      allChannels = [];
      favorites = [];
    }

    const drawer = document.getElementById('drawer');
    const video = document.getElementById('video-player');
    const container = document.getElementById('channels-container');
    const currentLabel = document.getElementById('current-playing');
    const statusLabel = document.getElementById('signal-status');
    const modeSelect = document.getElementById('mode-select');
    const searchInput = document.getElementById('search-input');
    const fileInput = document.getElementById('file-input');
    const urlInput = document.getElementById('url-input');

    function toggleDrawer(force) {
      if (typeof force === 'boolean') {
        drawer.classList.toggle('collapsed', !force);
      } else {
        drawer.classList.toggle('collapsed');
      }
    }

    document.getElementById('btn-menu').addEventListener('click', () => toggleDrawer());
    document.getElementById('video-stage').addEventListener('click', () => toggleDrawer());

    // Carga local / USB
    document.getElementById('btn-load-local').addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      statusLabel.textContent = '● LEYENDO...';
      statusLabel.style.color = '#fbbf24';

      const reader = new FileReader();
      reader.onload = (evt) => processM3UText(evt.target.result);
      reader.onerror = () => {
        statusLabel.textContent = '● ERROR ARCHIVO';
        statusLabel.style.color = '#ef4444';
      };
      reader.readAsText(file);
    });

    // Carga libre mediante URL remota de servidor
    document.getElementById('btn-load-url').addEventListener('click', async () => {
      let targetUrl = urlInput.value.trim();
      if (!targetUrl) {
        alert('Ingresa una URL válida de servidor IPTV.');
        return;
      }

      statusLabel.textContent = '● CONECTANDO URL...';
      statusLabel.style.color = '#fbbf24';

      try {
        // Intento de carga directa o mediante proxy CORS público si el servidor externo lo requiere
        let response = await fetch(targetUrl);
        if (!response.ok) throw new Error('Error HTTP');
        let text = await response.text();
        processM3UText(text);
      } catch (err) {
        // Alternativa con proxy CORS automático para listas remotas estrictas
        try {
          let proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl);
          let resProxy = await fetch(proxyUrl);
          let textProxy = await resProxy.text();
          processM3UText(textProxy);
        } catch (err2) {
          statusLabel.textContent = '● ERROR RED URL';
          statusLabel.style.color = '#ef4444';
          alert('No se pudo descargar la lista remota. Comprueba el enlace o restricciones CORS del servidor.');
        }
      }
    });

    // Parser M3U preservando duplicados en TV1
    function processM3UText(text) {
      const lines = text.split(/\r?\n/);
      const parsed = [];
      let title = 'Canal';

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (!line) continue;

        if (line.startsWith('#EXTINF:')) {
          let comma = line.lastIndexOf(',');
          title = comma !== -1 ? line.substring(comma + 1).trim() : 'Canal';
        } else if (!line.startsWith('#') && (line.startsWith('http://') || line.startsWith('https://') || line.startsWith('udp://'))) {
          parsed.push({ title: title || 'Canal', url: line.split(' ')[0] });
          title = 'Canal';
        }
      }

      if (parsed.length > 0) {
        allChannels = parsed;
        try { localStorage.setItem('okru_cinematic_db', JSON.stringify(allChannels)); } catch (e) {}
        renderList();
        playChannel(0);
        statusLabel.textContent = '● LISTO';
        statusLabel.style.color = '#10b981';
      } else {
        statusLabel.textContent = '● LISTA VACÍA';
        statusLabel.style.color = '#ef4444';
        alert('El archivo o enlace no contiene canales válidos.');
      }
    }

    function toggleFavorite(url, event) {
      event.stopPropagation();
      const idx = favorites.indexOf(url);
      if (idx === -1) favorites.push(url);
      else favorites.splice(idx, 1);
      try { localStorage.setItem('okru_cinematic_fav', JSON.stringify(favorites)); } catch (e) {}
      renderList();
    }

    function renderList() {
      const mode = modeSelect.value;
      const query = searchInput.value.toLowerCase().trim();

      filteredChannels = allChannels.filter(ch => {
        const matchMode = mode === 'FAV' ? favorites.includes(ch.url) : true;
        const matchQuery = !query || ch.title.toLowerCase().includes(query);
        return matchMode && matchQuery;
      });

      container.innerHTML = '';

      if (filteredChannels.length === 0) {
        container.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text-muted); font-size:0.85rem;">No hay canales disponibles en esta vista.</div>';
        return;
      }

      const activeCh = filteredChannels[currentIndex];
      const frag = document.createDocumentFragment();

      filteredChannels.forEach((ch, idx) => {
        const isFav = favorites.includes(ch.url);
        const isActive = activeCh && activeCh.url === ch.url && idx === currentIndex;

        const row = document.createElement('div');
        row.className = 'channel-row' + (isActive ? ' active' : '');
        row.tabIndex = 10 + idx;
        row.innerHTML = `
          <span class="ch-title">${idx + 1}. ${ch.title}</span>
          <span class="fav-star ${isFav ? 'is-fav' : ''}">★</span>
        `;

        row.addEventListener('click', () => playChannel(idx));
        row.addEventListener('keydown', (e) => { if (e.key === 'Enter') playChannel(idx); });
        row.querySelector('.fav-star').addEventListener('click', (e) => toggleFavorite(ch.url, e));

        frag.appendChild(row);
      });

      container.appendChild(frag);
    }

    // Motor de reproducción estabilizado (Anti-buffering y reconexión)
    function playChannel(idx) {
      if (filteredChannels.length === 0) return;
      if (idx < 0) idx = filteredChannels.length - 1;
      if (idx >= filteredChannels.length) idx = 0;

      currentIndex = idx;
      const ch = filteredChannels[currentIndex];
      currentLabel.textContent = `${currentIndex + 1}. ${ch.title}`;
      statusLabel.textContent = '● CONECTANDO';
      statusLabel.style.color = '#fbbf24';

      renderList();

      if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
      if (hls) { hls.destroy(); hls = null; }

      const isStream = ch.url.includes('.m3u8') || ch.url.includes('astra') || !ch.url.match(/\.(mp4|mkv|webm)$/i);

      if (window.Hls && Hls.isSupported() && isStream) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
          maxBufferLength: 30,
          maxMaxBufferLength: 60,
          maxBufferSize: 60 * 1000 * 1000,
          maxBufferHole: 0.5,
          liveSyncDurationCount: 3,
          manifestLoadingMaxRetry: 6,
          manifestLoadingRetryDelay: 1000,
          levelLoadingMaxRetry: 6,
          fragLoadingMaxRetry: 6
        });

        hls.loadSource(ch.url);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
          statusLabel.textContent = '● EN VIVO';
          statusLabel.style.color = '#10b981';
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            statusLabel.textContent = '● RECONECTANDO';
            statusLabel.style.color = '#fbbf24';
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
            else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
            else retryTimer = setTimeout(() => playChannel(currentIndex), 2500);
          }
        });
      } else {
        video.src = ch.url;
        video.play().then(() => {
          statusLabel.textContent = '● EN VIVO';
          statusLabel.style.color = '#10b981';
        }).catch(() => {
          statusLabel.textContent = '● REINTENTANDO';
          statusLabel.style.color = '#fbbf24';
          retryTimer = setTimeout(() => playChannel(currentIndex), 3000);
        });
      }
    }

    video.addEventListener('stalled', () => {
      statusLabel.textContent = '● ESTABILIZANDO';
      statusLabel.style.color = '#fbbf24';
      if (hls) hls.startLoad();
    });

    video.addEventListener('playing', () => {
      statusLabel.textContent = '● EN VIVO';
      statusLabel.style.color = '#10b981';
    });

    document.getElementById('btn-prev').addEventListener('click', () => playChannel(currentIndex - 1));
    document.getElementById('btn-next').addEventListener('click', () => playChannel(currentIndex + 1));
    modeSelect.addEventListener('change', renderList);
    searchInput.addEventListener('input', renderList);

    // Controles por control remoto D-Pad Smart TV Hisense
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ChannelUp' || e.key === 'PageUp') playChannel(currentIndex + 1);
      if (e.key === 'ChannelDown' || e.key === 'PageDown') playChannel(currentIndex - 1);
      if (e.key === 'Escape' || e.key === 'Backspace') {
        if (document.activeElement !== searchInput && document.activeElement !== urlInput) {
          toggleDrawer(false);
        }
      }
    });

    if (allChannels.length > 0) renderList();
  </script>
</body>
</html>
