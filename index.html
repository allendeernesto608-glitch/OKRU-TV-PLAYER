<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OKRU TV PLAYER</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html {
      width: 100vw;
      height: 100vh;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #video-box {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 1;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 360px;
      max-width: 85vw;
      height: 100vh;
      background: rgba(12, 16, 24, 0.96);
      z-index: 20;
      display: flex;
      flex-direction: column;
      padding: 16px;
      transition: transform 0.3s ease;
      border-right: 1px solid rgba(255,255,255,0.15);
      box-shadow: 5px 0 25px rgba(0,0,0,0.8);
    }
    .sidebar.hidden {
      transform: translateX(-100%);
    }
    .brand {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: #00f2fe;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-bottom: 10px;
      text-align: center;
      font-size: 0.9rem;
    }
    .btn:active, .btn:focus {
      background: #00f2fe;
      color: #000;
    }
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .input-box, .select-box {
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      width: 100%;
      font-size: 0.9rem;
    }
    .channels-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .channel-item {
      padding: 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.03);
    }
    .channel-item.active {
      background: rgba(0, 242, 254, 0.25);
      color: #00f2fe;
      font-weight: bold;
    }
    .bottom-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(12, 16, 24, 0.9);
      padding: 8px 16px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      transition: opacity 0.3s ease;
      box-shadow: 0 5px 20px rgba(0,0,0,0.6);
    }
    .bottom-bar.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .nav-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .nav-btn:active { background: #00f2fe; color: #000; }
  </style>
</head>
<body>

  <div id="video-box">
    <video id="video" playsinline webkit-playsinline autoplay></video>
  </div>

  <div class="sidebar" id="sidebar">
    <div class="brand">
      <span>OKRU TV</span>
      <span style="font-size: 0.7rem; background: rgba(0,242,254,0.2); padding: 2px 6px; border-radius: 4px; color: #00f2fe;">TV1 MODE</span>
    </div>
    
    <button class="btn" id="btn-file">📁 Cargar Archivo M3U / M3U8</button>
    <input type="file" id="file-input" accept=".m3u,.m3u8,.txt,*" style="display:none">

    <div class="filters">
      <select class="select-box" id="category-select">
        <option value="TV1">📺 TV1</option>
        <option value="FAV">⭐ Favoritos</option>
      </select>
      <input type="text" class="input-box" id="search-input" placeholder="Buscar canal...">
    </div>

    <div class="channels-list" id="channels-list"></div>
  </div>

  <div class="bottom-bar" id="bottom-bar">
    <button class="nav-btn" id="btn-prev">⏮ Ant</button>
    <span id="now-playing" style="font-size: 0.8rem; color: #00f2fe; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Sin señal</span>
    <button class="nav-btn" id="btn-next">Sig ⏭</button>
  </div>

  <script>
    let channels = [];
    try { channels = JSON.parse(localStorage.getItem('okru_channels_mob') || '[]'); } catch(e) { channels = []; }

    let favorites = [];
    try { favorites = JSON.parse(localStorage.getItem('okru_favs_mob') || '[]'); } catch(e) { favorites = []; }

    let currentIndex = -1;
    let filtered = [];
    let hls = null;
    let clickTimer = null;

    const video = document.getElementById('video');
    const sidebar = document.getElementById('sidebar');
    const bottomBar = document.getElementById('bottom-bar');
    const videoBox = document.getElementById('video-box');
    const listContainer = document.getElementById('channels-list');
    const categorySelect = document.getElementById('category-select');
    const searchInput = document.getElementById('search-input');
    const nowPlaying = document.getElementById('now-playing');
    const fileInput = document.getElementById('file-input');

    // Toque simple muestra menú / Doble toque oculta menú
    videoBox.addEventListener('click', () => {
      if (clickTimer === null) {
        clickTimer = setTimeout(() => {
          clickTimer = null;
          sidebar.classList.remove('hidden');
          bottomBar.classList.remove('hidden');
        }, 250);
      } else {
        clearTimeout(clickTimer);
        clickTimer = null;
        sidebar.classList.add('hidden');
        bottomBar.classList.add('hidden');
      }
    });

    function playChannel(index) {
      if (!filtered || filtered.length === 0) return;
      if (index < 0) index = filtered.length - 1;
      if (index >= filtered.length) index = 0;

      currentIndex = index;
      const ch = filtered[currentIndex];
      if (!ch) return;

      nowPlaying.textContent = `${currentIndex + 1}. ${ch.title}`;
      renderChannels();

      if (hls) {
        hls.destroy();
        hls = null;
      }

      if (window.Hls && Hls.isSupported() && (ch.url.includes('.m3u8') || ch.url.includes('astra') || !ch.url.endsWith('.mp4'))) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(ch.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
            else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
          }
        });
      } else {
        video.src = ch.url;
        video.play().catch(()=>{});
      }
    }

    document.getElementById('btn-prev').addEventListener('click', (e) => {
      e.stopPropagation();
      playChannel(currentIndex - 1);
    });

    document.getElementById('btn-next').addEventListener('click', (e) => {
      e.stopPropagation();
      playChannel(currentIndex + 1);
    });

    function parseM3U(text) {
      const lines = text.split(/\r?\n/);
      const list = [];
      let title = 'Canal';

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (!line) continue;
        if (line.startsWith('#EXTINF:')) {
          const comma = line.lastIndexOf(',');
          title = comma !== -1 ? line.substring(comma + 1).trim() : 'Canal';
        } else if (!line.startsWith('#') && (line.startsWith('http://') || line.startsWith('https://') || line.startsWith('udp://'))) {
          list.push({ title: title || 'Canal', group: 'TV1', url: line.split(' ')[0] });
          title = 'Canal';
        }
      }
      return list;
    }

    function toggleFav(url, e) {
      e.stopPropagation();
      const pos = favorites.indexOf(url);
      if (pos === -1) favorites.push(url);
      else favorites.splice(pos, 1);
      try { localStorage.setItem('okru_favs_mob', JSON.stringify(favorites)); } catch(e){}
      renderChannels();
    }

    function renderChannels() {
      const cat = categorySelect.value;
      const query = searchInput.value.toLowerCase().trim();

      filtered = channels.filter(ch => {
        const matchCat = cat === 'FAV' ? favorites.includes(ch.url) : true;
        const matchQuery = !query || ch.title.toLowerCase().includes(query);
        return matchCat && matchQuery;
      });

      listContainer.innerHTML = '';

      if (!filtered || filtered.length === 0) {
        listContainer.innerHTML = `<div style="padding:15px; color:#aaa; font-size:0.85rem;">Selecciona tu archivo M3U para cargar la lista en TV1.</div>`;
        return;
      }

      const activeCh = filtered[currentIndex];
      const fragment = document.createDocumentFragment();

      filtered.forEach((ch, idx) => {
        const isFav = favorites.includes(ch.url);
        const isActive = activeCh && activeCh.url === ch.url;

        const div = document.createElement('div');
        div.className = `channel-item ${isActive ? 'active' : ''}`;
        div.innerHTML = `
          <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; font-size:0.9rem;">${idx + 1}. ${ch.title}</span>
          <span style="color:${isFav ? '#ffd700' : '#444'}; padding-left:8px; font-size:1.1rem;">★</span>
        `;

        div.addEventListener('click', (e) => {
          e.stopPropagation();
          playChannel(idx);
        });

        div.querySelector('span:last-child').addEventListener('click', (e) => toggleFav(ch.url, e));
        fragment.appendChild(div);
      });

      listContainer.appendChild(fragment);
    }

    document.getElementById('btn-file').addEventListener('click', (e) => {
      e.stopPropagation();
      fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = parseM3U(ev.target.result);
          if (parsed && parsed.length > 0) {
            channels = parsed;
            localStorage.setItem('okru_channels_mob', JSON.stringify(channels));
            renderChannels();
            playChannel(0);
          } else {
            alert('El archivo no contiene canales válidos.');
          }
        } catch(err) {
          alert('Error al leer el archivo.');
        }
      };
      reader.readAsText(file);
    });

    categorySelect.addEventListener('change', renderChannels);
    searchInput.addEventListener('input', renderChannels);

    if (channels && channels.length > 0) {
      renderChannels();
    }
  </script>
</body>
</html>
