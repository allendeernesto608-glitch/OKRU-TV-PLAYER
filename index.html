<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLAZA DE LA DIGNIDAD TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0a09; --bone:#fafaf9; --terra:#c2410c; --amber:#fb923c; --cream:#fde68a;
  --glass:rgba(24,20,18,.80);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--bone);
  font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:
  radial-gradient(ellipse at 20% 15%,rgba(194,65,12,.28),transparent 55%),
  radial-gradient(ellipse at 85% 90%,rgba(120,53,15,.35),transparent 60%),
  var(--bg)}

/* Splash mientras sintoniza */
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:4vw;transition:opacity .6s;z-index:1}
#splash.off{opacity:0;pointer-events:none}
.brand{font-weight:900;text-transform:uppercase;font-size:clamp(28px,6.2vw,96px);line-height:1;letter-spacing:.02em}
.brand b{color:var(--amber);font-weight:900}
.tagline{font-family:"Playfair Display",Georgia,serif;font-style:italic;color:var(--cream);
  font-size:clamp(16px,2.4vw,36px);margin-top:1.2vw}

/* Video */
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:transparent;z-index:2}

/* Menú de vidrio */
#menu{position:fixed;left:0;top:0;width:400px;max-width:85vw;height:100vh;z-index:10;
  background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-right:1px solid rgba(253,230,138,.14);display:flex;flex-direction:column;
  transform:translateX(0);transition:transform .35s ease}
#menu.closed{transform:translateX(-105%);pointer-events:none}
#menu header{padding:28px 26px 18px;border-bottom:1px solid rgba(253,230,138,.14)}
#menu .brand{font-size:26px;line-height:1.1}
#menu .tagline{font-size:16px;margin-top:8px}
#list{list-style:none;flex:1;overflow-y:auto;padding:12px 12px 24px;scrollbar-width:none}
#list::-webkit-scrollbar{display:none}
#list li{display:flex;align-items:center;gap:14px;padding:14px 14px;margin:4px 0;border-radius:10px;
  border-left:4px solid transparent;cursor:pointer;transition:background .15s}
#list li .n{min-width:34px;font-weight:900;font-size:18px;color:var(--amber)}
#list li .t{flex:1;min-width:0}
#list li .nm{display:block;font-weight:900;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list li .gp{display:block;font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:13px;color:var(--cream);opacity:.8}
#list li.live::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--amber)}
#list li.focus{background:rgba(194,65,12,.45);border-left-color:var(--cream)}
#menu footer{padding:12px 26px 18px;font-size:12px;color:rgba(250,250,249,.6);border-top:1px solid rgba(253,230,138,.14)}

/* OSD reloj */
#clock{position:fixed;top:22px;right:28px;z-index:9;display:flex;align-items:center;gap:10px;
  padding:8px 16px;border-radius:999px;background:rgba(24,20,18,.75);font-weight:900;font-size:18px;
  transition:opacity .35s}
#clock.hide{opacity:0}
#clock i{width:10px;height:10px;border-radius:50%;background:#ef4444;box-shadow:0 0 8px #ef4444}
#clock span.l{font-size:12px;letter-spacing:.08em;color:#fca5a5}

/* OSD cartel de canal */
#osd{position:fixed;right:28px;bottom:28px;z-index:9;min-width:260px;max-width:70vw;padding:16px 22px;
  border-radius:12px;background:rgba(24,20,18,.88);border-left:5px solid var(--terra);
  opacity:0;transform:translateY(12px);transition:opacity .3s,transform .3s;pointer-events:none}
#osd.show{opacity:1;transform:none}
#osd .num{font-weight:900;font-size:34px;color:var(--amber);line-height:1}
#osd .nm{font-weight:900;font-size:20px;margin-top:4px}
#osd .st{font-family:"Playfair Display",Georgia,serif;font-style:italic;color:var(--cream);font-size:15px;margin-top:4px}

@media (max-width:600px){
  #osd{right:14px;bottom:14px}#clock{top:12px;right:12px;font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="splash">
  <h1 class="brand">Plaza de la Dignidad <b>TV</b></h1>
  <p class="tagline">“La historia es nuestra”</p>
</div>

<video id="video" playsinline autoplay muted></video>

<aside id="menu" aria-label="Lista de canales">
  <header>
    <div class="brand">Plaza de la Dignidad <b>TV</b></div>
    <p class="tagline">“La historia es nuestra”</p>
  </header>
  <ul id="list" role="listbox"></ul>
  <footer>OK elegir · ▲▼ moverse · CH+/CH− zapping</footer>
</aside>

<div id="clock"><i></i><span class="l">EN VIVO</span><span id="time">--:--</span></div>
<div id="osd" role="status" aria-live="polite">
  <div class="num" id="osdNum"></div><div class="nm" id="osdName"></div><div class="st" id="osdState"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
(function(){
'use strict';

/* ===== Configuración ===== */
const M3U_URL = ""; // Pega aquí la URL de tu lista .m3u

const FALLBACK = [
  {name:"Mux Test Stream",        group:"Pruebas", url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
  {name:"Akamai Live Test",       group:"Pruebas", url:"https://cph-p2p-msl.akamaized.net/hls/live/2000341/test/master.m3u8"},
  {name:"Unified Streaming",      group:"Pruebas", url:"https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8"},
  {name:"Apple Advanced Stream",  group:"Pruebas", url:"https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8"}
];

/* ===== Parser M3U ===== */
function parseM3U(text){
  const out = [], lines = String(text).split(/\r?\n/);
  const secure = window.location.protocol === 'https:';
  let cur = null;
  for (let raw of lines){
    const l = raw.trim();
    if (!l) continue;
    if (l.startsWith('#EXTINF')){
      const g = l.match(/group-title="([^"]*)"/i);
      const comma = l.lastIndexOf(',');
      cur = {
        name: (comma >= 0 ? l.slice(comma + 1).trim() : '') || 'Canal',
        group: g ? g[1].trim() : ''
      };
    } else if (!l.startsWith('#')){
      if (/^https?:\/\//i.test(l) && !(secure && /^http:\/\//i.test(l))){
        out.push({name: cur ? cur.name : 'Canal ' + (out.length + 1), group: cur ? cur.group : '', url: l});
      }
      cur = null;
    }
  }
  return out;
}

/* ===== Elementos y estado ===== */
const $ = id => document.getElementById(id);
const video = $('video'), menu = $('menu'), list = $('list'), clock = $('clock'),
      osd = $('osd'), splash = $('splash');
let channels = [], playing = -1, focused = 0, hls = null, retries = 0, osdTimer = null;
const isLocal = window.location.protocol === 'file:';

/* ===== Menú ===== */
function renderList(){
  list.innerHTML = '';
  channels.forEach((c, i) => {
    const li = document.createElement('li');
    li.setAttribute('role', 'option');
    li.innerHTML = '<span class="n"></span><span class="t"><span class="nm"></span><span class="gp"></span></span>';
    li.querySelector('.n').textContent = i + 1;
    li.querySelector('.nm').textContent = c.name;
    li.querySelector('.gp').textContent = c.group;
    li.addEventListener('click', () => { focused = i; paintFocus(false); playChannel(i, true); });
    list.appendChild(li);
  });
  paintFocus(false);
}
function paintFocus(scroll){
  [...list.children].forEach((li, i) => {
    li.classList.toggle('focus', i === focused);
    li.classList.toggle('live', i === playing);
    if (i === focused) li.setAttribute('aria-selected', 'true'); else li.removeAttribute('aria-selected');
  });
  const el = list.children[focused];
  if (el && scroll !== false) el.scrollIntoView({block:'center', behavior:'smooth'});
}
function menuOpen(){ return !menu.classList.contains('closed'); }
function openMenu(){
  menu.classList.remove('closed'); clock.classList.remove('hide');
  video.muted = false;
  if (video.paused) video.play().catch(() => { video.muted = true; video.play().catch(()=>{}); });
  focused = playing >= 0 ? playing : focused; paintFocus(true);
}
function closeMenu(){ menu.classList.add('closed'); clock.classList.add('hide'); }

/* ===== OSD ===== */
function showOSD(state){
  const c = channels[playing]; if (!c) return;
  $('osdNum').textContent = playing + 1;
  $('osdName').textContent = c.name;
  $('osdState').textContent = state;
  osd.classList.add('show');
  clearTimeout(osdTimer);
  osdTimer = setTimeout(() => osd.classList.remove('show'), 3500);
}
function tickClock(){
  const d = new Date();
  $('time').textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

/* ===== Streaming ===== */
function destroyHls(){
  if (!hls) return;
  try { hls.stopLoad(); hls.detachMedia(); hls.destroy(); } catch(e){}
  hls = null;
}
function tryPlay(){
  const p = video.play();
  if (p && p.catch) p.catch(() => { video.muted = true; video.play().catch(()=>{}); });
}
function playChannel(i, hideMenu){
  if (!channels.length) return;
  playing = (i + channels.length) % channels.length;
  focused = playing; retries = 0;
  const c = channels[playing];
  paintFocus(menuOpen());
  showOSD('Sintonizando…');
  splash.classList.remove('off');
  destroyHls();
  video.removeAttribute('src'); video.load();
  if (hideMenu) { video.muted = false; closeMenu(); }

  if (window.Hls && Hls.isSupported()){
    hls = new Hls({
      enableWorker: !isLocal,
      maxBufferLength: 30,
      maxMaxBufferLength: 60,
      maxBufferSize: 60 * 1000 * 1000,
      startLevel: -1,
      capLevelToPlayerSize: true
    });
    hls.on(Hls.Events.MANIFEST_PARSED, tryPlay);
    hls.on(Hls.Events.FRAG_LOADED, () => { retries = 0; });
    hls.on(Hls.Events.ERROR, (ev, data) => {
      if (!data.fatal) return;
      if (data.type === Hls.ErrorTypes.NETWORK_ERROR && retries < 3){
        retries++; showOSD('Reconectando…'); hls.startLoad();
      } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR && retries < 3){
        retries++; showOSD('Reconectando…'); hls.recoverMediaError();
      } else {
        showOSD('Error de señal'); destroyHls();
      }
    });
    hls.loadSource(c.url);
    hls.attachMedia(video);
  } else if (video.canPlayType('application/vnd.apple.mpegurl')){
    video.src = c.url; tryPlay();
  } else {
    showOSD('Error: formato no compatible');
  }
}
video.addEventListener('playing', () => { splash.classList.add('off'); showOSD('En vivo'); });
video.addEventListener('waiting', () => { if (playing >= 0) showOSD('Sintonizando…'); });
video.addEventListener('error', () => { if (!hls && playing >= 0) showOSD('Error de señal'); });

/* ===== Control remoto y teclado ===== */
const K = {
  OK:[13], LEFT:[37], RIGHT:[39], UP:[38], DOWN:[40],
  BACK:[8, 27, 461, 10009], CHUP:[33, 427], CHDOWN:[34, 428]
};
const has = (arr, e) => arr.includes(e.keyCode);
document.addEventListener('keydown', e => {
  const k = e.key;
  let handled = true;
  if (has(K.CHUP, e) || k === 'ChannelUp' || k === 'PageUp'){
    playChannel(playing + 1, false);
  } else if (has(K.CHDOWN, e) || k === 'ChannelDown' || k === 'PageDown'){
    playChannel(playing - 1, false);
  } else if (has(K.UP, e) || k === 'ArrowUp'){
    if (menuOpen()){ focused = (focused - 1 + channels.length) % channels.length; paintFocus(true); }
    else playChannel(playing - 1, false);
  } else if (has(K.DOWN, e) || k === 'ArrowDown'){
    if (menuOpen()){ focused = (focused + 1) % channels.length; paintFocus(true); }
    else playChannel(playing + 1, false);
  } else if (has(K.OK, e) || k === 'Enter'){
    if (menuOpen()) playChannel(focused, true); else openMenu();
  } else if (has(K.LEFT, e) || k === 'ArrowLeft'){
    openMenu();
  } else if (has(K.RIGHT, e) || k === 'ArrowRight' || has(K.BACK, e) || k === 'Escape' || k === 'Backspace' || k === 'GoBack'){
    closeMenu();
  } else handled = false;
  if (handled) e.preventDefault();
});

/* Toque en celular: pantalla de video abre el menú y activa el sonido */
video.addEventListener('click', openMenu);
splash.addEventListener('click', openMenu);

/* ===== Arranque ===== */
async function init(){
  tickClock(); setInterval(tickClock, 15000);
  if (M3U_URL){
    try {
      const r = await fetch(M3U_URL, {cache:'no-store'});
      if (!r.ok) throw new Error(r.status);
      channels = parseM3U(await r.text());
    } catch(e){ channels = []; }
  }
  if (!channels.length) channels = FALLBACK;
  renderList();
  playChannel(0, false); // sintoniza en silencio con el menú abierto
}
init();

})();
</script>
</body>
</html>
