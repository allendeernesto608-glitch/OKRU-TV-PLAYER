<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OKRUTV PLAYER - Smart TV Edition</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-color: #0b0e14;
      --panel-bg: rgba(18, 24, 38, 0.95);
      --card-bg: #1a2333;
      --accent-color: #ff3366;
      --focus-color: #00d2ff;
      --text-main: #ffffff;
      --text-sub: #8a99ad;
      --fav-color: #ffca28;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      outline: none;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* MENÚ LATERAL DESPLEGABLE */
    .sidebar {
      width: 380px;
      height: 100%;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      position: absolute;
      left: 0;
      top: 0;
      box-shadow: 5px 0 25px rgba(0,0,0,0.7);
    }

    .sidebar.hidden {
      transform: translateX(-100%);
    }

    .brand-header {
      padding: 20px;
      background: linear-gradient(90deg, #1f1c2c, #928dab);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-header h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #fff;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-header h1 span {
      color: var(--accent-color);
    }

    .controls-panel {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(0, 0, 0, 0.2);
    }

    .btn {
      background: var(--card-bg);
      color: #fff;
      border: 2px solid transparent;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.2s;
    }

    .btn:focus, .btn.focusable-focused {
      border-color: var(--focus-color);
      box-shadow: 0 0 15px var(--focus-color);
      background: #25334c;
      transform: scale(1.02);
    }

    .category-select {
      background: var(--card-bg);
      color: #fff;
      border: 2px solid transparent;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .category-select:focus, .category-select.focusable-focused {
      border-color: var(--focus-color);
      box-shadow: 0 0 15px var(--focus-color);
    }

    .channel-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .channel-item {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
      gap: 12px;
      position: relative;
    }

    .channel-item:focus, .channel-item.focusable-focused {
      border-color: var(--focus-color);
      background: rgba(0, 210, 255, 0.15);
      transform: translateX(5px);
    }

    .channel-item.active {
      border-left: 5px solid var(--accent-color);
      background: rgba(255, 51, 102, 0.15);
    }

    .channel-logo {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
      background: #000;
    }

    .channel-info {
      flex: 1;
      overflow: hidden;
    }

    .channel-name {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .channel-group {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .fav-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.3);
      font-size: 1.3rem;
      cursor: pointer;
      padding: 5px;
      transition: color 0.2s;
    }

    .fav-btn.is-fav {
      color: var(--fav-color);
    }

    /* ZONA DEL REPRODUCTOR */
    .player-section {
      flex: 1;
      height: 100%;
      position: relative;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* CONTROLES OVERLAY VIDEO */
    .player-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.9));
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .player-section:hover .player-controls,
    .player-controls.visible {
      opacity: 1;
    }

    .control-bar {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .progress-bar {
      flex: 1;
      height: 6px;
      background: rgba(255,255,255,0.3);
      border-radius: 3px;
      position: relative;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent-color);
      width: 0%;
      border-radius: 3px;
    }

    /* MODAL */
    .modal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
    }

    .modal.hidden { display: none; }

    .modal-content {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      width: 450px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .modal-content input {
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #0b0e14;
      color: #fff;
    }

    .hint-bar {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0,0,0,0.6);
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--text-sub);
      pointer-events: none;
      z-index: 90;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="hint-bar">
    🖱️ 1 Clic: Abrir Menú | Doble Clic: Ocultar Menú | ⌨️ 'F': Favorito
  </div>

  <!-- MENÚ LATERAL -->
  <div class="sidebar" id="sidebar">
    <div class="brand-header">
      <h1>OKRUTV <span>PLAYER</span></h1>
    </div>

    <div class="controls-panel">
      <button class="btn focusable" id="btn-load-file">📁 Cargar Archivo M3U / Astra</button>
      <input type="file" id="file-input" accept=".m3u,.m3u8,.txt" style="display: none;">
      
      <button class="btn focusable" id="btn-open-url">🔗 Cargar URL de Lista</button>
      
      <select class="category-select focusable" id="category-select">
        <option value="ALL">📺 Todos los Canales</option>
        <option value="FAV">⭐ Favoritos</option>
      </select>
    </div>

    <div class="channel-list" id="channel-list"></div>
  </div>

  <!-- ZONA DE VIDEO -->
  <div class="player-section" id="player-section">
    <video id="video-player" autoplay></video>

    <div class="player-controls" id="player-controls">
      <div class="progress-bar" id="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="control-bar">
        <button class="btn focusable" id="btn-play">▶️ / ⏸️</button>
        <button class="btn focusable" id="btn-toggle-menu">📋 Menú</button>
        <span id="current-channel-title" style="margin-left: auto; font-size: 0.9rem;">Selecciona un canal</span>
      </div>
    </div>
  </div>
</div>

<!-- MODAL Cargar URL -->
<div class="modal hidden" id="url-modal">
  <div class="modal-content">
    <h3>Cargar Lista M3U / M3U8 / Astra</h3>
    <input type="text" id="url-input" placeholder="https://ejemplo.com/lista.m3u">
    <button class="btn focusable" id="btn-confirm-url">Cargar Lista</button>
    <button class="btn focusable" id="btn-close-modal">Cancelar</button>
  </div>
</div>

<script>
  let channels = [];
  let favorites = JSON.parse(localStorage.getItem('okru_favs') || '[]');
  let hls = null;
  let clickTimer = null;

  const sidebar = document.getElementById('sidebar');
  const playerSection = document.getElementById('player-section');
  const video = document.getElementById('video-player');
  const channelListEl = document.getElementById('channel-list');
  const categorySelect = document.getElementById('category-select');
  const fileInput = document.getElementById('file-input');
  const urlModal = document.getElementById('url-modal');
  const urlInput = document.getElementById('url-input');

  // --- CONTROL DE CLIC Y DOBLE CLIC ---
  playerSection.addEventListener('click', (e) => {
    // Evitar que el clic en los controles active la acción del fondo
    if (e.target.closest('#player-controls')) return;

    if (clickTimer === null) {
      clickTimer = setTimeout(() => {
        clickTimer = null;
        // ACCIÓN UN CLIC: Mostrar menú
        sidebar.classList.remove('hidden');
      }, 250);
    } else {
      clearTimeout(clickTimer);
      clickTimer = null;
      // ACCIÓN DOBLE CLIC: Ocultar menú
      sidebar.classList.add('hidden');
    }
  });

  // --- GESTIÓN DE FAVORITOS ---
  function toggleFavorite(url, e) {
    if(e) e.stopPropagation();
    
    const index = favorites.indexOf(url);
    if (index === -1) {
      favorites.push(url);
    } else {
      favorites.splice(index, 1);
    }
    localStorage.setItem('okru_favs', JSON.stringify(favorites));
    renderChannels();
  }

  // --- REPRODUCTOR HLS / HTML5 ---
  function playChannel(url, title) {
    document.getElementById('current-channel-title').textContent = title;
    
    if (Hls.isSupported() && (url.includes('.m3u8') || url.includes('astra'))) {
      if (hls) hls.destroy();
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.play();
    } else {
      video.src = url;
      video.play();
    }
  }

  // --- PARSER DE LISTAS M3U / ASTRA ---
  function parseM3U(content) {
    const lines = content.split('\n');
    const parsedChannels = [];
    let currentChannel = {};

    lines.forEach(line => {
      line = line.trim();
      if (line.startsWith('#EXTINF:')) {
        const nameMatch = line.split(',');
        const name = nameMatch[nameMatch.length - 1];
        
        const logoMatch = line.match(/tvg-logo="([^"]*)"/);
        const groupMatch = line.match(/group-title="([^"]*)"/);

        currentChannel = {
          title: name || 'Canal sin nombre',
          logo: logoMatch ? logoMatch[1] : '',
          group: groupMatch ? groupMatch[1] : 'General'
        };
      } else if (line.length > 0 && !line.startsWith('#')) {
        currentChannel.url = line;
        parsedChannels.push({...currentChannel});
        currentChannel = {};
      }
    });

    return parsedChannels;
  }

  // --- RENDERIZADO Y FILTRADO DE CANALES ---
  function renderChannels() {
    channelListEl.innerHTML = '';
    const selectedGroup = categorySelect.value;

    const filtered = channels.filter(ch => {
      if (selectedGroup === 'FAV') return favorites.includes(ch.url);
      if (selectedGroup === 'ALL') return true;
      return ch.group === selectedGroup;
    });

    filtered.forEach(ch => {
      const isFav = favorites.includes(ch.url);
      const item = document.createElement('div');
      item.className = 'channel-item focusable';
      item.innerHTML = `
        <img class="channel-logo" src="${ch.logo || 'https://via.placeholder.com/40'}" onerror="this.src='https://via.placeholder.com/40'">
        <div class="channel-info">
          <div class="channel-name">${ch.title}</div>
          <div class="channel-group">${ch.group}</div>
        </div>
        <button class="fav-btn ${isFav ? 'is-fav' : ''}">★</button>
      `;

      item.addEventListener('click', () => playChannel(ch.url, ch.title));
      
      const favBtn = item.querySelector('.fav-btn');
      favBtn.addEventListener('click', (e) => toggleFavorite(ch.url, e));

      channelListEl.appendChild(item);
    });

    updateCategoryOptions();
  }

  function updateCategoryOptions() {
    const groups = [...new Set(channels.map(c => c.group))];
    categorySelect.innerHTML = `
      <option value="ALL">📺 Todos los Canales (${channels.length})</option>
      <option value="FAV">⭐ Favoritos (${favorites.length})</option>
    `;
    groups.forEach(g => {
      if(g) {
        const opt = document.createElement('option');
        opt.value = g;
        opt.textContent = g;
        categorySelect.appendChild(opt);
      }
    });
  }

  // --- CARGA DE ARCHIVOS Y URLS ---
  document.getElementById('btn-load-file').addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (event) => {
        channels = parseM3U(event.target.result);
        renderChannels();
      };
      reader.readAsText(file);
    }
  });

  document.getElementById('btn-open-url').addEventListener('click', () => urlModal.classList.remove('hidden'));
  document.getElementById('btn-close-modal').addEventListener('click', () => urlModal.classList.add('hidden'));

  document.getElementById('btn-confirm-url').addEventListener('click', () => {
    const url = urlInput.value.trim();
    if (url) {
      fetch(url)
        .then(res => res.text())
        .then(text => {
          channels = parseM3U(text);
          renderChannels();
          urlModal.classList.add('hidden');
        })
        .catch(() => alert('Error al cargar la lista desde la URL'));
    }
  });

  document.getElementById('btn-toggle-menu').addEventListener('click', (e) => {
    e.stopPropagation();
    sidebar.classList.toggle('hidden');
  });

  document.getElementById('btn-play').addEventListener('click', () => {
    if (video.paused) video.play();
    else video.pause();
  });

  // --- CONTROL DE TECLADO / TV REMOTE ---
  document.addEventListener('keydown', (e) => {
    if (e.key === 'f' || e.key === 'F') {
      const activeElement = document.activeElement;
      if (activeElement && activeElement.classList.contains('channel-item')) {
        activeElement.querySelector('.fav-btn').click();
      }
    }
    if (e.key === 'm' || e.key === 'M') {
      sidebar.classList.toggle('hidden');
    }
  });
</script>
</body>
</html>
