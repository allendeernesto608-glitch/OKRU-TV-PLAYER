
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OKRU TV - High Performance Smart Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-cyan: #00f2fe;
      --accent-pink: #ff007f;
      --star-gold: #ffd700;
      --bg-glass: rgba(5, 8, 14, 0.85);
      --border-glass: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      outline: none;
      font-family: 'Outfit', sans-serif;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      background: #000;
      color: var(--text-main);
      overflow: hidden;
    }

    #video-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    .status-badge {
      position: fixed;
      top: 20px;
      right: 24px;
      z-index: 35;
      background: rgba(10, 14, 22, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-glass);
      padding: 7px 16px;
      border-radius: 30px;
      font-size: 0.82rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }
    .dot-indicator.loading { background: var(--star-gold); box-shadow: 0 0 10px var(--star-gold); animation: blink 0.8s infinite alternate; }
    .dot-indicator.error { background: var(--accent-pink); box-shadow: 0 0 10px var(--accent-pink); }

    @keyframes blink {
      from { opacity: 0.4; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1.3); }
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 410px;
      max-width: 88vw;
      height: 100vh;
      z-index: 30;
      background: linear-gradient(90deg, rgba(4, 7, 12, 0.95) 0%, rgba(4, 7, 12, 0.7) 75%, rgba(4, 7, 12, 0) 100%);
      backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      padding: 24px 20px;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    .sidebar.hidden {
      transform: translateX(-105%);
      opacity: 0;
      pointer-events: none;
    }

    .brand-area {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .brand-name {
      font-size: 1.8rem;
      font-weight: 800;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    }

    .brand-name span {
      background: linear-gradient(135deg, var(--primary-cyan), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-tv {
      font-size: 0.68rem;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-glass);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
    }

    .actions-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn-ui {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      padding: 10px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-ui:hover, .btn-ui:focus {
      background: rgba(0, 242, 254, 0.2);
      border-color: var(--primary-cyan);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.3);
    }

    .filters-box {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .input-ui, .select-ui {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      width: 100%;
    }

    .select-ui option { background: #0c101d; }

    .input-ui:focus, .select-ui:focus {
      border-color: var(--primary-cyan);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
    }

    /* CONTENEDOR DE LISTA DE ALTO RENDIMIENTO */
    .channels-list-viewport {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }

    .channel-row-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 12px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .channel-info-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      flex: 1;
    }

    .channel-idx-num {
      font-size: 0.78rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.4);
      min-width: 26px;
    }

    .channel-name-txt {
      font-size: 1.02rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.82);
      text-shadow: 0 2px 5px rgba(0,0,0,0.9);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: all 0.15s ease;
    }

    .channel-row-item:hover .channel-name-txt,
    .channel-row-item:focus .channel-name-txt {
      color: #ffffff;
      font-weight: 700;
      font-size: 1.08rem;
      text-shadow: 0 0 12px rgba(0, 242, 254, 0.9), 0 2px 4px #000;
      transform: translateX(3px);
    }

    .channel-row-item.active .channel-name-txt {
      color: var(--primary-cyan);
      font-weight: 700;
      font-size: 1.08rem;
      text-shadow: 0 0 12px rgba(0, 242, 254, 0.8), 0 2px 4px #000;
    }

    .channel-row-item.active .channel-idx-num {
      color: var(--primary-cyan);
      font-weight: 800;
    }

    .star-fav-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.25);
      font-size: 1.15rem;
      cursor: pointer;
      padding: 4px 6px;
    }

    .star-fav-btn.active { color: var(--star-gold); text-shadow: 0 0 10px rgba(255, 215, 0, 0.8); }

    /* PESTAÑAS INFERIORES CENTRALES */
    .bottom-floating-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(10, 14, 22, 0.8);
      backdrop-filter: blur(12px);
      padding: 7px 14px;
      border-radius: 40px;
      border: 1px solid var(--border-glass);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    .bottom-floating-bar.hidden {
      transform: translateX(-50%) translateY(100px);
      opacity: 0;
      pointer-events: none;
    }

    .nav-tab-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-glass);
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
    }

    .nav-tab-btn:hover, .nav-tab-btn:focus {
      background: linear-gradient(135deg, var(--primary-cyan), #0088ff);
      color: #000;
      border-color: #fff;
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
    }

    .current-playing-label {
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary-cyan);
      padding: 0 6px;
      text-align: center;
    }

    /* MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(2, 4, 8, 0.88);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.hidden { display: none; }

    .modal-content-box {
      width: 600px;
      max-width: 95vw;
      background: #0d1322;
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header-row h3 { color: var(--primary-cyan); font-size: 1.25rem; }

    .presets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
    }

    .preset-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preset-chip:hover, .preset-chip:focus {
      background: rgba(0, 242, 254, 0.2);
      border-color: var(--primary-cyan);
    }

    textarea.input-ui {
      min-height: 80px;
      resize: vertical;
      font-family: monospace;
      font-size: 0.8rem;
    }

    .modal-footer-row {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div id="video-container">
    <video id="video-player" playsinline autoplay></video>
  </div>

  <div class="status-badge" id="status-badge">
    <div class="dot-indicator" id="status-dot"></div>
    <span id="status-text">OKRU TV Listo</span>
  </div>

  <aside class="sidebar" id="sidebar-menu">
    <div class="brand-area">
      <div class="brand-name">OKRU <span>TV</span></div>
      <div class="badge-tv">PLAYER</div>
    </div>

    <div class="actions-box">
      <button class="btn-ui" id="btn-open-modal">🌐 Servidores / URL</button>
      <button class="btn-ui" id="btn-open-file">📁 Archivo / USB</button>
      <input type="file" id="file-selector" accept=".m3u,.m3u8,.txt,*" style="display:none">
    </div>

    <div class="filters-box">
      <select class="select-ui" id="category-select" style="width: 45%;">
        <option value="ALL">📺 Todos</option>
        <option value="FAV">⭐ Favoritos</option>
      </select>
      <input type="text" class="input-ui" id="search-input" placeholder="🔍 Buscar canal..." style="width: 55%;">
    </div>

    <div class="channels-list-viewport" id="channels-viewport"></div>
  </aside>

  <div class="bottom-floating-bar" id="bottom-bar">
    <button class="nav-tab-btn" id="btn-prev-chan">⏮ Anterior</button>
    <div class="current-playing-label" id="current-playing-label">Ningún canal</div>
    <button class="nav-tab-btn" id="btn-next-chan">Siguiente ⏭</button>
  </div>

  <div class="modal-backdrop hidden" id="modal-backdrop">
    <div class="modal-content-box">
      <div class="modal-header-row">
        <h3>📡 Cargar Lista, Servidor o Astra</h3>
        <button class="btn-ui" id="btn-close-modal" style="padding: 4px 10px;">✕</button>
      </div>

      <label style="font-size:0.82rem; color:var(--text-muted);">Ingresa URL, IP:Puerto o Enlace (M3U, M3U8, Astra, GitHub, Blogspot):</label>
      <input type="text" class="input-ui" id="url-target-input" placeholder="Ej: http://190.60.39.220:8000/ o https://...">

      <label style="font-size:0.82rem; color:var(--text-muted);">⚡ Servidores y Listas Rápidas:</label>
      <div class="presets-grid" id="presets-grid"></div>

      <details>
        <summary style="cursor:pointer; font-size:0.82rem; color:var(--primary-cyan); font-weight:600;">📋 Pegar código M3U / Astra directo</summary>
        <div style="margin-top:6px; display:flex; flex-direction:column; gap:6px;">
          <textarea class="input-ui" id="raw-text-input" placeholder="#EXTM3U&#10;#EXTINF:-1,Canal&#10;http://servidor:8000/live/..."></textarea>
          <button class="btn-ui" id="btn-process-raw">Cargar Contenido Pegado</button>
        </div>
      </details>

      <div class="modal-footer-row">
        <button class="btn-ui" id="btn-submit-url" style="background: linear-gradient(135deg, var(--primary-cyan), #0088ff); color:#000; border:none; font-weight:700;">🚀 Conectar y Reproducir</button>
      </div>
    </div>
  </div>

  <script>
    const PRESETS = [
      { name: "IPTV-Org Global", url: "https://iptv-org.github.io/iptv/index.m3u" },
      { name: "IPTV-Org Español", url: "https://iptv-org.github.io/iptv/languages/spa.m3u" },
      { name: "Lista TV Flix HD 2026", url: "https://listatvflixhd2026.blogspot.com" },
      { name: "Cablemax HLS", url: "http://cablemaxsigloxxi.com:8000/playlist.m3u?hls" },
      { name: "Cablemax Root", url: "http://cablemaxsigloxxi.com:8000/" },
      { name: "Servidor 190.60.39.220", url: "http://190.60.39.220:8000/" },
      { name: "Servidor 170.244.209.30", url: "http://170.244.209.30:8000/" },
      { name: "Servidor 38.188.48.83", url: "http://38.188.48.83:8000/" }
    ];

    let allChannels = JSON.parse(localStorage.getItem('okru_channels_v3') || '[]');
    let favoriteUrls = JSON.parse(localStorage.getItem('okru_favs_v3') || '[]');
    let customServers = JSON.parse(localStorage.getItem('okru_servers_v3') || '[]');
    let activeIndex = -1;
    let visibleChannels = [];
    let hlsInstance = null;
    let clickTimer = null;

    const videoEl = document.getElementById('video-player');
    const sidebarEl = document.getElementById('sidebar-menu');
    const bottomBarEl = document.getElementById('bottom-bar');
    const videoContainer = document.getElementById('video-container');
    const channelsViewport = document.getElementById('channels-viewport');
    const categorySelect = document.getElementById('category-select');
    const searchInput = document.getElementById('search-input');
    const currentPlayingLabel = document.getElementById('current-playing-label');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const modalBackdrop = document.getElementById('modal-backdrop');
    const urlTargetInput = document.getElementById('url-target-input');

    // CONTROL DE MENÚ (1 CLIC / DOBLE CLIC)
    function showMenu() {
      sidebarEl.classList.remove('hidden');
      bottomBarEl.classList.remove('hidden');
    }

    function hideMenu() {
      sidebarEl.classList.add('hidden');
      bottomBarEl.classList.add('hidden');
    }

    videoContainer.addEventListener('click', (e) => {
      if (clickTimer === null) {
        clickTimer = setTimeout(() => {
          clickTimer = null;
          showMenu();
        }, 250);
      } else {
        clearTimeout(clickTimer);
        clickTimer = null;
        hideMenu();
      }
    });

    function setStatus(state, msg) {
      statusDot.className = 'dot-indicator ' + state;
      statusText.textContent = msg;
    }

    // MOTOR DE REPRODUCCIÓN
    function playChannelByIndex(idx) {
      if (visibleChannels.length === 0) return;
      if (idx < 0) idx = visibleChannels.length - 1;
      if (idx >= visibleChannels.length) idx = 0;

      activeIndex = idx;
      const ch = visibleChannels[activeIndex];
      if (!ch) return;

      currentPlayingLabel.textContent = `${activeIndex + 1}. ${ch.title}`;
      setStatus('loading', `Cargando: ${ch.title}`);
      renderList();

      initStream(ch.url, ch.title, false);
    }

    function initStream(url, title, useProxy) {
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      let target = url.trim();
      if (useProxy) {
        target = `https://corsproxy.io/?${encodeURIComponent(url)}`;
      }

      const isHls = target.includes('.m3u8') || target.includes('hls') || target.includes('/live/') || target.includes('astra') || (!target.endsWith('.mp4') && !target.endsWith('.ts'));

      if (Hls.isSupported() && isHls) {
        hlsInstance = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 15,
          maxBufferLength: 12
        });

        hlsInstance.loadSource(target);
        hlsInstance.attachMedia(videoEl);

        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          videoEl.play().catch(() => {});
          setStatus('', `En vivo: ${title}`);
        });

        hlsInstance.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
              if (!useProxy && window.location.protocol === 'https:' && url.startsWith('http://')) {
                initStream(url, title, true);
              } else {
                hlsInstance.startLoad();
              }
            } else {
              hlsInstance.destroy();
              videoEl.src = target;
              videoEl.play().catch(() => setStatus('error', 'Señal no disponible'));
            }
          }
        });
      } else {
        videoEl.src = target;
        videoEl.play()
          .then(() => setStatus('', `Reproduciendo: ${title}`))
          .catch(() => {
            if (!useProxy) initStream(url, title, true);
            else setStatus('error', 'Servidor inaccesible');
          });
      }
    }

    videoEl.addEventListener('playing', () => setStatus('', `En vivo: ${currentPlayingLabel.textContent}`));
    videoEl.addEventListener('waiting', () => setStatus('loading', 'Sincronizando...'));

    document.getElementById('btn-prev-chan').addEventListener('click', (e) => {
      e.stopPropagation();
      playChannelByIndex(activeIndex - 1);
    });

    document.getElementById('btn-next-chan').addEventListener('click', (e) => {
      e.stopPropagation();
      playChannelByIndex(activeIndex + 1);
    });

    // PARSER M3U / ASTRA
    function parseM3U(text) {
      const lines = text.split(/\r?\n/);
      const list = [];
      let meta = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        if (line.startsWith('#EXTINF:')) {
          const commaIdx = line.lastIndexOf(',');
          const title = commaIdx !== -1 ? line.substring(commaIdx + 1).trim() : 'Canal TV';
          const groupMatch = line.match(/group-title="([^"]*)"/i);
          meta = {
            title: title || 'Canal',
            group: groupMatch && groupMatch[1] ? groupMatch[1].trim() : 'General'
          };
        } else if (!line.startsWith('#') && (line.startsWith('http://') || line.startsWith('https://') || line.startsWith('udp://'))) {
          list.push({
            title: meta ? meta.title : `Canal ${list.length + 1}`,
            group: meta ? meta.group : 'Streams',
            url: line.split(' ')[0].trim()
          });
          meta = null;
        }
      }

      if (list.length === 0) {
        const matches = text.match(/(https?:\/\/[^\s"'<>]+\.(?:m3u8|m3u|ts|mp4)[^\s"'<>]*)/gi);
        if (matches) {
          [...new Set(matches)].forEach((u, idx) => {
            list.push({ title: `Stream Web ${idx + 1}`, group: 'Web', url: u });
          });
        }
      }
      return list;
    }

    async function fetchRemote(targetUrl) {
      const proxies = [
        (u) => u,
        (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
        (u) => `https://corsproxy.io/?${encodeURIComponent(u)}`
      ];

      for (const p of proxies) {
        try {
          const ctrl = new AbortController();
          const tId = setTimeout(() => ctrl.abort(), 8000);
          const res = await fetch(p(targetUrl), { signal: ctrl.signal });
          clearTimeout(tId);
          if (res.ok) {
            const data = await res.text();
            if (data && data.length > 5) return data;
          }
        } catch(e){}
      }
      throw new Error('Fallo al conectar');
    }

    async function loadPlaylist(targetUrl) {
      let url = targetUrl.trim();
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = 'http://' + url;

      setStatus('loading', 'Conectando servidor...');

      const candidates = [url];
      if (url.endsWith('/') || /:\d+$/.test(url)) {
        const base = url.replace(/\/+$/, '');
        candidates.push(`${base}/playlist.m3u8`, `${base}/playlist.m3u`, `${base}/playlist.m3u?hls`, `${base}/channels.m3u`);
      }

      let loaded = [];
      for (const cand of candidates) {
        try {
          const raw = await fetchRemote(cand);
          const parsed = parseM3U(raw);
          if (parsed.length > 0) {
            loaded = parsed;
            break;
          }
        } catch(e){}
      }

      if (loaded.length === 0) {
        loaded = [{ title: `Directo: ${url.replace(/^https?:\/\//, '').substring(0, 20)}`, group: 'Directos', url: url }];
      }

      allChannels = loaded;
      localStorage.setItem('okru_channels_v3', JSON.stringify(allChannels));
      saveServer(url);
      buildCategories();
      renderList();
      modalBackdrop.classList.add('hidden');
      setStatus('', `${allChannels.length} canales cargados`);

      if (allChannels.length > 0) playChannelByIndex(0);
    }

    function toggleFav(url, e) {
      if (e) e.stopPropagation();
      const p = favoriteUrls.indexOf(url);
      if (p === -1) favoriteUrls.push(url);
      else favoriteUrls.splice(p, 1);
      localStorage.setItem('okru_favs_v3', JSON.stringify(favoriteUrls));
      buildCategories();
      renderList();
    }

    function buildCategories() {
      const activeCat = categorySelect.value;
      const groups = [...new Set(allChannels.map(c => c.group).filter(Boolean))];
      categorySelect.innerHTML = `
        <option value="ALL">📺 Todos (${allChannels.length})</option>
        <option value="FAV">⭐ Favoritos (${favoriteUrls.length})</option>
      `;
      groups.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g;
        opt.textContent = g;
        categorySelect.appendChild(opt);
      });
      if ([...categorySelect.options].some(o => o.value === activeCat)) {
        categorySelect.value = activeCat;
      }
    }

    // RENDERIZADO OPTIMIZADO (EVITA PANTALLA EN BLANCO)
    function renderList() {
      const cat = categorySelect.value;
      const q = searchInput.value.toLowerCase().trim();

      visibleChannels = allChannels.filter(ch => {
        const matchCat = cat === 'ALL' ? true : cat === 'FAV' ? favoriteUrls.includes(ch.url) : ch.group === cat;
        const matchQ = !q || ch.title.toLowerCase().includes(q);
        return matchCat && matchQ;
      });

      channelsViewport.innerHTML = '';

      if (visibleChannels.length === 0) {
        channelsViewport.innerHTML = `<div style="padding:16px; color:var(--text-muted); font-size:0.85rem;">No hay canales disponibles en esta vista.</div>`;
        return;
      }

      // Renderizado por lotes inteligente para evitar congelamiento en TV
      const activeCh = visibleChannels[activeIndex];
      const fragment = document.createDocumentFragment();

      // Limitar a los primeros 300 elementos visibles simultáneos para garantizar fluidez extrema
      const renderLimit = Math.min(visibleChannels.length, 300);
      
      for (let i = 0; i < renderLimit; i++) {
        const ch = visibleChannels[i];
        const isFav = favoriteUrls.includes(ch.url);
        const isActive = activeCh && activeCh.url === ch.url;

        const row = document.createElement('div');
        row.className = `channel-row-item ${isActive ? 'active' : ''}`;
        row.tabIndex = 0;

        row.innerHTML = `
          <div class="channel-info-wrap">
            <span class="channel-idx-num">${i + 1}</span>
            <span class="channel-name-txt">${ch.title}</span>
          </div>
          <button class="star-fav-btn ${isFav ? 'active' : ''}">★</button>
        `;

        row.addEventListener('click', (e) => {
          e.stopPropagation();
          playChannelByIndex(i);
        });

        row.querySelector('.star-fav-btn').addEventListener('click', (e) => toggleFav(ch.url, e));
        fragment.appendChild(row);
      }

      channelsViewport.appendChild(fragment);
    }

    function saveServer(url) {
      if (!PRESETS.some(s => s.url === url) && !customServers.some(s => s.url === url)) {
        customServers.unshift({ name: url.replace(/^https?:\/\//, '').substring(0, 20), url });
        customServers = customServers.slice(0, 5);
        localStorage.setItem('okru_servers_v3', JSON.stringify(customServers));
      }
      renderPresets();
    }

    function renderPresets() {
      const grid = document.getElementById('presets-grid');
      grid.innerHTML = '';
      [...customServers, ...PRESETS].forEach(item => {
        const pill = document.createElement('button');
        pill.className = 'preset-chip';
        pill.textContent = item.name;
        pill.title = item.url;
        pill.addEventListener('click', () => {
          urlTargetInput.value = item.url;
          loadPlaylist(item.url);
        });
        grid.appendChild(pill);
      });
    }

    document.getElementById('btn-open-modal').addEventListener('click', (e) => {
      e.stopPropagation();
      renderPresets();
      modalBackdrop.classList.remove('hidden');
      urlTargetInput.focus();
    });

    document.getElementById('btn-close-modal').addEventListener('click', () => modalBackdrop.classList.add('hidden'));
    document.getElementById('btn-submit-url').addEventListener('click', () => loadPlaylist(urlTargetInput.value));

    document.getElementById('btn-process-raw').addEventListener('click', () => {
      const raw = document.getElementById('raw-text-input').value;
      const parsed = parseM3U(raw);
      if (parsed.length > 0) {
        allChannels = parsed;
        localStorage.setItem('okru_channels_v3', JSON.stringify(allChannels));
        buildCategories();
        renderList();
        modalBackdrop.classList.add('hidden');
        playChannelByIndex(0);
      } else {
        alert('No se detectaron canales en el texto.');
      }
    });

    document.getElementById('btn-open-file').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('file-selector').click();
    });

    document.getElementById('file-selector').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const parsed = parseM3U(ev.target.result);
        if (parsed.length > 0) {
          allChannels = parsed;
          localStorage.setItem('okru_channels_v3', JSON.stringify(allChannels));
          buildCategories();
          renderList();
          setStatus('', `Cargado: ${file.name}`);
          playChannelByIndex(0);
        } else {
          setStatus('error', 'Archivo sin canales válidos');
        }
      };
      reader.readAsText(file);
    });

    categorySelect.addEventListener('change', renderList);
    searchInput.addEventListener('input', renderList);

    // CONTROL REMOTO TV
    document.addEventListener('keydown', (e) => {
      if (!modalBackdrop.classList.contains('hidden')) {
        if (e.key === 'Escape' || e.key === 'Backspace') modalBackdrop.classList.add('hidden');
        return;
      }

      switch (e.key) {
        case 'ChannelUp':
        case 'PageUp':
          playChannelByIndex(activeIndex + 1);
          break;
        case 'ChannelDown':
        case 'PageDown':
          playChannelByIndex(activeIndex - 1);
          break;
        case 'ArrowRight':
          if (sidebarEl.classList.contains('hidden')) playChannelByIndex(activeIndex + 1);
          break;
        case 'ArrowLeft':
          if (sidebarEl.classList.contains('hidden')) playChannelByIndex(activeIndex - 1);
          break;
        case 'Enter':
          if (sidebarEl.classList.contains('hidden')) showMenu();
          break;
        case 'Escape':
        case 'Backspace':
          if (document.activeElement !== searchInput) hideMenu();
          break;
        case 'f':
        case 'F':
          if (visibleChannels[activeIndex]) toggleFav(visibleChannels[activeIndex].url);
          break;
      }
    });

    renderPresets();
    if (allChannels.length > 0) {
      buildCategories();
      renderList();
    } else {
      loadPlaylist("https://iptv-org.github.io/iptv/languages/spa.m3u");
    }
  </script>
</body>
</html>
